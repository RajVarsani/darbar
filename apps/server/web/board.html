<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Darbar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23d8ff7c'/%3E%3Cpath d='M6.5 24.5V10.5l5.5 5L16 6.5l4 9 5.5-5v14z' fill='%231c1c1c' stroke='%231c1c1c' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19.5' r='2.5' fill='%23d8ff7c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#d8ff7c;          /* the one surface */
    --ink:#1c1c1c;           /* text + borders */
    --beige:#eae5db;         /* raised components */
    --beige-2:#f2eee6;       /* lighter inset rows */
    --ink-soft:rgba(28,28,28,.55);
    --ink-faint:rgba(28,28,28,.35);
    --hair:rgba(28,28,28,.16);
    --green-deep:#133f26;    /* ink-on-lime accents */
    --green:#2d8654;         /* success */
    --green-pale:#eaf5ec;
    --red:#7a2a20;           /* danger */
    --red-pale:#f5e6e3;
    --sans:'IBM Plex Sans',-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{height:100%}
  body{min-height:100%;background:var(--lime);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
  a{color:var(--green-deep);text-decoration:underline;text-underline-offset:2px}
  ::selection{background:var(--ink);color:var(--lime)}

  /* ---------- brand ---------- */
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
  .brand .dot{width:24px;height:24px;background:var(--ink);color:var(--lime);display:grid;place-items:center;
    font-size:13px;font-weight:800}

  .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:var(--green-deep)}
  .live::before{content:"";width:8px;height:8px;background:var(--green);border:1.5px solid var(--ink);animation:pulse 2.2s infinite}
  .live.off{color:var(--ink-soft)} .live.off::before{background:var(--beige);animation:none}
  @keyframes pulse{50%{opacity:.25}}

  /* ---------- top bar: one sticky header, two stacked rows ---------- */
  .top{position:sticky;top:0;z-index:30;background:var(--lime);border-bottom:2px solid var(--ink)}
  .toprow{display:flex;align-items:center;gap:16px;padding:0 24px;height:54px;border-bottom:1.5px solid var(--hair)}
  .toprow2{height:44px;gap:10px;border-bottom:none;overflow-x:auto}
  .views,.lanes{display:flex;align-items:center;gap:4px}
  .lanes{gap:8px}
  .vtab{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;
    padding:5px 11px;border:2px solid transparent;color:var(--ink-soft);transition:.08s;white-space:nowrap}
  .vtab:hover{border-color:var(--ink);color:var(--ink)}
  .vtab.on{background:var(--ink);color:var(--lime)}
  .vtab svg,.lanechip svg{flex:none}
  .vtab .n,.lanechip .n{font-size:10px;font-weight:800;background:var(--beige);border:1.5px solid var(--ink);
    color:var(--ink);padding:0 5px;min-width:18px;text-align:center}
  .vtab.on .n,.lanechip.on .n{background:var(--lime)}
  .vtab .n.zero,.lanechip .n.zero{opacity:.35}
  .lanechip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:700;
    padding:3px 9px;border:2px solid var(--ink);background:var(--beige);color:var(--ink);white-space:nowrap;transition:.08s}
  .lanechip:hover{box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .lanechip.on{background:var(--ink);color:var(--lime);box-shadow:none;transform:none}
  .crumb{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:10px}
  .chip{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--beige);border:2px solid var(--ink);
    padding:1px 7px;letter-spacing:.04em}
  .searchwrap{flex:1;display:flex;justify-content:center}
  .search{display:flex;align-items:center;gap:8px;width:min(420px,100%);background:var(--beige);
    border:2px solid var(--ink);padding:6px 12px;color:var(--ink-soft);transition:box-shadow .1s,transform .1s}
  .search:focus-within{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
  .search svg{flex:none}
  .search input{border:none;outline:none;background:none;width:100%;font-family:var(--mono);font-size:13px;color:var(--ink)}
  .search input::placeholder{color:var(--ink-faint)}
  .search kbd{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--lime);border:1.5px solid var(--ink);
    padding:1px 6px;color:var(--ink)}
  .people{display:flex;align-items:center;gap:4px}
  .ava{width:26px;height:26px;border:2px solid var(--ink);display:grid;place-items:center;
    font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ink);background:var(--beige)}

  /* ---------- page ---------- */
  .page{max-width:1560px;margin:0 auto;width:100%;padding:24px 24px 64px}
  h1{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.01em}
  .pagehead{display:flex;align-items:baseline;gap:14px;margin:2px 0 20px;flex-wrap:wrap}
  .pagehead .sub{color:var(--ink-soft);font-family:var(--mono);font-size:12px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
  .stat{background:var(--beige);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:13px 16px}
  .stat .lbl{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .stat .val{font-family:var(--mono);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 1px}
  .stat .val .of{color:var(--ink-faint);font-size:15px;font-weight:700}
  .stat .hint{font-size:12px;color:var(--ink-soft)}
  .stat .hint b{color:var(--green-deep);font-weight:700}
  .progress{height:8px;border:1.5px solid var(--ink);background:var(--beige-2);margin-top:10px}
  .progress i{display:block;height:100%;background:var(--green);border-right:1.5px solid var(--ink);transition:width .4s}
  .progress i[style*="width: 0%"]{border-right:none}
  .spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:8px}
  .spark i{flex:1;background:var(--beige-2);border:1.5px solid var(--ink);min-height:4px;transition:height .3s}
  .spark i.hot{background:var(--lime)}

  /* ---------- kanban ---------- */
  .kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:14px;overflow-x:auto;
    align-items:start;padding-bottom:10px}
  .kcol{background:var(--beige);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-width:0}
  .kcol.over{background:var(--lime);outline:2px dashed var(--ink);outline-offset:-7px}
  .khead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--ink);
    font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
  .khead .n{margin-left:auto;font-size:10px;background:var(--beige-2);border:1.5px solid var(--ink);padding:0 6px;
    font-variant-numeric:tabular-nums}
  .kcards{display:flex;flex-direction:column;gap:10px;padding:10px;min-height:56px;max-height:calc(100vh - 366px);overflow-y:auto}
  .kcard{background:var(--beige-2);border:2px solid var(--ink);padding:9px 11px 10px;cursor:pointer;transition:transform .08s,box-shadow .08s}
  .kcard:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
  .kcard.sel{background:var(--lime)}
  .kcard.ghost{opacity:.35}
  .krow1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .kcard .ttl{white-space:normal;font-size:13px;font-weight:600;line-height:1.35}
  .kfoot{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .kfoot .who{transform:scale(.95);transform-origin:left center}
  .kempty{padding:14px 12px;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:11px}
  /* empty columns go quiet so real work stands out; still a live drop target */
  .kcol.slim{box-shadow:2px 2px 0 var(--ink)}
  .kcol.slim .khead{color:var(--ink-faint)}
  .kcol.slim .khead .n{opacity:.4}
  .kcol.slim .kcards{min-height:34px;padding:6px 10px}
  .kcol.slim .kempty{padding:6px 10px}
  .kcol.slim.over .khead{color:var(--ink)}
  .kmore{display:block;width:100%;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;padding:5px 12px;color:var(--ink-soft);border-top:2px solid var(--ink);transition:.08s}
  .kmore:hover{background:var(--lime);color:var(--ink)}

  /* review pips: one square per pipeline lane on the parent card */
  .pips{display:inline-flex;gap:3px;align-items:center;padding:3px 6px;border:1.5px solid var(--ink);background:var(--beige)}
  .pips .plbl{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);margin-right:2px}
  .pip{width:9px;height:9px;border:1.5px solid var(--ink);background:var(--beige-2)}
  .pip.p-run{background:var(--lime)}
  .pip.p-done{background:var(--green)}
  .pip.p-blocked{background:var(--red)}
  .pip.p-cancelled{background:var(--ink-faint)}

  /* ---------- content box (list / feedback / activity / lane) ---------- */
  .content{background:var(--beige);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-width:0}
  .viewbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid var(--ink)}
  .viewbar .vtitle{font-family:var(--mono);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .viewbar .vn{font-family:var(--mono);font-size:10px;color:var(--ink-soft);font-weight:700}
  .filters{margin-left:auto;display:flex;border:2px solid var(--ink)}
  .seg{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 12px;
    color:var(--ink-soft);border-right:2px solid var(--ink)}
  .seg:last-child{border-right:none}
  .seg.on{background:var(--lime);color:var(--ink)}

  /* ---------- rows ---------- */
  .list{min-height:300px}
  .trow{display:grid;grid-template-columns:26px 76px minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:11px 16px 11px 10px;border-bottom:1.5px solid var(--hair);cursor:pointer;transition:background .08s}
  .trow:hover{background:var(--beige-2)}
  .trow.sel{background:var(--lime);box-shadow:inset 4px 0 0 var(--ink)}
  .trow:last-child{border-bottom:none}
  .trow.sub .id::before{content:"└ ";color:var(--ink-faint)}
  .trow.sub{grid-template-columns:26px 92px minmax(0,1fr) auto}
  .caret{width:22px;height:22px;display:grid;place-items:center;color:var(--ink-soft);border:1.5px solid transparent}
  .caret:hover{border-color:var(--ink);color:var(--ink)}
  .caret svg{transition:transform .12s}
  .caret.openc svg{transform:rotate(90deg)}
  .id{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
  .fbn{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft)}
  .fbn.warn{color:var(--green-deep)}

  .frow{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:12px;align-items:start;
    padding:12px 16px;border-bottom:1.5px solid var(--hair);cursor:pointer;transition:background .08s}
  .frow:hover{background:var(--beige-2)}
  .frow.sel{background:var(--lime);box-shadow:inset 4px 0 0 var(--ink)}
  .frow:last-child{border-bottom:none}
  .fbody{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .fsub{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
  .frow .col{min-width:0}
  .time{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* pills + chips — square, bordered, uppercase */
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;border:2px solid var(--ink);padding:1.5px 8px;white-space:nowrap;background:var(--beige-2)}
  .st-todo,.st-backlog{color:var(--ink-soft)}
  .st-in_progress,.st-triaged,.st-accepted{background:var(--lime);color:var(--ink)}
  .st-qa,.st-in_review{background:var(--beige-2);color:var(--green-deep);border-color:var(--green-deep)}
  .st-blocked{background:var(--red-pale);color:var(--red);border-color:var(--red)}
  .st-done,.st-resolved{background:var(--green);color:#fff}
  .st-pending,.st-needs_clarification{background:var(--ink);color:var(--lime)}
  .st-rejected,.st-cancelled{color:var(--ink-faint);border-color:var(--ink-faint)}
  .who{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
    border:2px solid var(--ink);padding:1px 8px 1px 2px;background:var(--beige-2)}
  .who .a{width:16px;height:16px;display:grid;place-items:center;font-size:8.5px;font-weight:800}
  .who.human .a{background:var(--ink);color:var(--lime)}
  .who.agent .a{background:var(--green);color:#fff}
  .who.agent{border-color:var(--green-deep);color:var(--green-deep)}
  .typ{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:2px solid}
  .typ-bug{color:var(--red);border-color:var(--red);background:var(--red-pale)}
  .typ-design{color:var(--green-deep);border-color:var(--green-deep);background:var(--green-pale)}
  .typ-idea{color:var(--ink);border-color:var(--ink);background:var(--lime)}
  .typ-approval{color:#fff;border-color:var(--ink);background:var(--green)}
  .typ-feature{color:var(--ink);border-color:var(--ink);background:var(--lime)}
  .typ-chore{color:var(--ink-soft);border-color:var(--ink-soft);background:var(--beige-2)}
  .typ-review{color:var(--green-deep);border-color:var(--green-deep);background:var(--green-pale)}
  .typ-regression{color:var(--red);border-color:var(--red);background:var(--red-pale)}

  /* ---------- activity ---------- */
  .evgroup{padding:16px 18px 6px;font-family:var(--mono);color:var(--ink-soft);font-size:10.5px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--hair)}
  .ev{display:grid;grid-template-columns:56px 14px minmax(0,1fr);gap:10px;padding:8px 18px;align-items:center;
    border-bottom:1.5px solid var(--hair)}
  .ev:last-child{border-bottom:none}
  .ev .t{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
  .ev .b{position:relative;height:100%}
  .ev .b::before{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:7px;height:7px;background:var(--lime);border:1.5px solid var(--ink)}
  .ev .x{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .x b{color:var(--ink);font-weight:700;font-family:var(--mono);font-size:11.5px}

  /* ---------- drawer: fixed full-height right panel, overlays content on every view ---------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:45;background:var(--beige);
    border-left:2px solid var(--ink);box-shadow:-8px 0 0 rgba(28,28,28,.25);display:flex;flex-direction:column;
    overflow:hidden;transform:translateX(calc(100% + 12px));transition:transform .18s ease}
  .drawer.open{transform:none}
  .dhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:2px solid var(--ink);background:var(--beige-2)}
  .dhead .grow{flex:1}
  .iconbtn{width:26px;height:26px;display:grid;place-items:center;color:var(--ink);border:2px solid var(--ink);
    background:var(--beige);transition:.08s}
  .iconbtn:hover{background:var(--ink);color:var(--lime)}
  .iconbtn[disabled]{opacity:.3;pointer-events:none}
  .dbody{flex:1;overflow-y:auto;padding:18px 20px 24px}
  .dempty{display:grid;place-items:center;text-align:center;padding:64px 24px;color:var(--ink-soft);font-family:var(--mono);font-size:12.5px}
  .dempty .big{width:44px;height:44px;border:2px solid var(--ink);background:var(--lime);display:grid;place-items:center;margin:0 auto 14px}
  .dtitle{font-family:var(--mono);font-size:17px;font-weight:700;margin:10px 0 2px;text-wrap:balance;line-height:1.35}
  .dgrid{display:grid;grid-template-columns:100px 1fr;row-gap:9px;column-gap:12px;margin:14px 0;font-size:13px}
  .dgrid .k{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);padding-top:2px}
  .dsec{margin-top:22px}
  .dsec>h3{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
  .mini{border:2px solid var(--ink);background:var(--beige-2)}
  .mini .trow,.mini .frow{padding-left:12px}
  .quote{background:var(--beige-2);border:2px solid var(--ink);padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-weight:500}
  .shots{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .shots a img{width:100px;height:70px;object-fit:cover;border:2px solid var(--ink);transition:.1s;display:block}
  .shots a:hover img{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
  .commits{font-family:var(--mono);font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px}
  .taskcard{border:2px solid var(--ink);background:var(--beige-2);padding:11px 13px;cursor:pointer;transition:.1s;
    display:flex;gap:10px;align-items:center}
  .taskcard:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink);background:var(--lime)}
  .flow{display:flex;align-items:center;margin-top:4px;flex-wrap:wrap;row-gap:8px}
  .step{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-faint);border:2px solid var(--ink-faint);padding:2px 8px;background:var(--beige-2)}
  .step.hit{background:var(--green);color:#fff;border-color:var(--ink)}
  .step.now{background:var(--ink);color:var(--lime);border-color:var(--ink)}
  .step.bad{background:var(--red);color:#fff;border-color:var(--ink)}
  .arrow{color:var(--ink-faint);margin:0 5px;font-family:var(--mono);font-size:10px}
  .note{font-size:12px;color:var(--ink-soft);margin-top:8px}
  .resol{border:2px solid var(--ink);border-left:6px solid var(--green);background:var(--green-pale);padding:10px 14px;font-weight:500}
  .resol.neg{border-left-color:var(--red);background:var(--red-pale)}
  .devents{border-left:2px solid var(--ink);margin-left:3px;padding-left:14px;display:flex;flex-direction:column;gap:9px;
    font-size:12.5px;color:var(--ink-soft)}
  .devents .t{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase}

  .empty{padding:52px 24px;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:12.5px}
  .empty b{color:var(--ink)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--lime);
    font-family:var(--mono);font-size:12px;font-weight:700;padding:11px 18px;border:2px solid var(--ink);
    box-shadow:4px 4px 0 rgba(28,28,28,.35);z-index:70;transition:transform .18s;max-width:min(560px,90vw)}
  .toast.show{transform:translate(-50%,0)}

  @media (max-width:1080px){
    .toprow{padding:0 14px;gap:10px}
    .crumb,.people,.search kbd{display:none}
    .drawer{inset:auto 0 0 0;top:auto;width:auto;max-height:76vh;z-index:40;border-left:none;border-top:2px solid var(--ink);
      box-shadow:0 -4px 0 var(--ink);transform:translateY(105%);transition:transform .22s ease}
    .drawer.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(28,28,28,.45);z-index:35;opacity:0;pointer-events:none;transition:.2s}
    .scrim.on{opacity:1;pointer-events:auto}
  }
  @media (min-width:1081px){ .scrim{display:none} }
</style>
</head>
<body data-view="board">
<header class="top">
  <div class="toprow">
    <div class="brand"><span class="dot">D</span>DARBAR</div>
    <div class="crumb"><span id="pname">…</span> <span class="chip" id="pprefix"></span></div>
    <div class="searchwrap">
      <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="search tasks, feedback, ids…" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
    </div>
    <div class="people" id="people"></div>
    <span class="live" id="livedot">live</span>
  </div>
  <div class="toprow toprow2">
    <nav class="views" id="views"></nav>
    <span style="flex:1"></span>
    <nav class="lanes" id="lanes"></nav>
  </div>
</header>

<main>
<div class="page">
  <div class="pagehead"><h1 id="ptitle">…</h1><span class="sub" id="psub"></span></div>
  <section class="stats" id="stats"></section>

  <section class="kanban" id="kanban" hidden></section>

  <section class="content" id="content" hidden>
    <div class="viewbar" id="viewbar"></div>
    <div class="list" id="list"></div>
  </section>
</div>
</main>
<!-- fixed full-height right panel; slides in on selection, bottom sheet under 1080px -->
<aside class="drawer" id="drawer"></aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
const capId = location.pathname.split('/').pop();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const KANBAN_COLS = ['backlog','todo','in_progress','in_review','qa','blocked','done'];

const state = {
  data: null,
  view: 'board',           // board | list | feedback | activity | lane
  lane: null,              // active lane key when view === 'lane'
  fbFilter: 'open',        // open | all | closed
  taskFilter: 'all',       // all | active | done
  q: '',
  sel: null,               // {kind:'task'|'fb', id: shortId}
  stack: [],               // drawer back stack of sel objects
  collapsed: new Set(),    // task shortIds with hidden children
  doneExpanded: false,     // done column: false = latest 5 only
  canWrite: null,          // null = unknown; probed once. Tunnel viewers get 403 on writes.
};

const initials = n => n.split(/[\s-]+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const relTime = iso => {
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s<60) return 'just now';
  if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`;
  if (s<86400*7) return `${Math.floor(s/86400)}d ago`;
  return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
};
const nice = s => String(s||'').replace(/_/g,' ');
const safeUrl = a => /^(https?:\/\/|\/)/i.test(String(a||'')); // block javascript:/data: schemes
let toastT;
function toast(msg){
  const el=$('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'), 3200);
}

// ---------- data helpers ----------
const tasks = () => state.data?.tasks ?? [];
const fbs = () => state.data?.feedback ?? [];
const pipeline = () => state.data?.project?.pipeline ?? null;
const byShort = id => tasks().find(t=>t.shortId===id);
const fbByShort = id => fbs().find(f=>f.shortId===id);
const childrenOf = t => tasks().filter(x=>x.parentTaskId===t._id);
const reviewKidsOf = t => childrenOf(t).filter(k=>k.type==='review');
const fbForTask = t => fbs().filter(f=>f.taskId===t._id);
const openFb = f => !['resolved','rejected'].includes(f.status);
const isClosed = t => ['done','cancelled'].includes(t.status);
const eventsForTask = t => { const re = new RegExp('\\b'+t.shortId+'\\b'); return (state.data?.events??[]).filter(e=>e.taskId===t._id || re.test(e.text||'')); };
const pipCls = s => s==='in_progress'||s==='in_review'||s==='qa' ? 'p-run' : s==='done' ? 'p-done' : s==='blocked' ? 'p-blocked' : s==='cancelled' ? 'p-cancelled' : '';

// ---------- rendering ----------
function render(){
  const d = state.data; if(!d) return;
  document.title = `${d.project.name} · Darbar`;
  $('pname').textContent = d.project.name;
  $('pprefix').textContent = d.project.prefix;
  $('ptitle').textContent = d.project.name;
  $('psub').textContent = (d.project.repos||[]).join(' · ');
  document.body.dataset.view = state.view;
  renderTopNav(); renderPeople(); renderStats(); renderContent(); renderDrawer();
}

const ICONS = {
  board: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="5" height="16"/><rect x="10" y="4" width="5" height="10"/><rect x="17" y="4" width="4" height="13"/></svg>',
  list: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
  feedback: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.5-.7L3 21l1.8-4.4a8.4 8.4 0 1 1 16.2-5.1z"/></svg>',
  activity: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  lane: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m9 11 3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>',
};

function renderTopNav(){
  const pendFb = fbs().filter(f=>['pending','needs_clarification'].includes(f.status)).length;
  const openTasks = tasks().filter(t=>!isClosed(t)&&t.type!=='review').length;
  const views = [
    {id:'board', label:'Board', n: openTasks, icon:'board'},
    {id:'list', label:'List', n: tasks().length, icon:'list'},
    {id:'feedback', label:'Feedback', n: pendFb, icon:'feedback'},
    {id:'activity', label:'Activity', n: null, icon:'activity'},
  ];
  $('views').innerHTML = views.map(v =>
    `<button class="vtab ${state.view===v.id?'on':''}" data-view-btn="${v.id}">${ICONS[v.icon]}${v.label}${v.n!==null?`<span class="n ${v.n?'':'zero'}">${v.n}</span>`:''}</button>`).join('');
  const lanes = pipeline()?.reviews ?? [];
  $('lanes').innerHTML = lanes.map(l => {
    const open = tasks().filter(t=>t.type==='review'&&t.lane===l.lane&&!isClosed(t)).length;
    return `<button class="lanechip ${state.view==='lane'&&state.lane===l.lane?'on':''}" data-lane-btn="${esc(l.lane)}">${ICONS.lane}${esc(l.label)}<span class="n ${open?'':'zero'}">${open}</span></button>`;
  }).join('');
}

function renderPeople(){
  const ppl = state.data.project.stakeholders||[];
  const agents = [...new Set(tasks().filter(t=>t.assigneeType==='agent'&&t.assignee).map(t=>t.assignee))];
  $('people').innerHTML = ppl.map(p=>
    `<span class="ava" title="${esc(p.name)} · ${esc(p.role||'stakeholder')}">${esc(initials(p.name))}</span>`).join('')
    + agents.map(a=>`<span class="ava" title="${esc(a)} · agent" style="background:var(--ink);color:var(--lime)">${esc(initials(a))}</span>`).join('');
}

function renderStats(){
  const ts = tasks().filter(t=>t.type!=='review');
  const done = ts.filter(t=>t.status==='done').length;
  const reviews = tasks().filter(t=>t.type==='review');
  const openRev = reviews.filter(t=>!isClosed(t)).length;
  const pend = fbs().filter(f=>['pending','needs_clarification'].includes(f.status)).length;
  const open = fbs().filter(openFb).length;
  const humans = new Set(fbs().filter(f=>f.authorType==='human').map(f=>f.author));
  const agents = new Set(fbs().filter(f=>f.authorType==='agent').map(f=>f.author));
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toDateString();});
  const per=days.map(ds=>(state.data.events||[]).filter(e=>new Date(e.at).toDateString()===ds).length);
  const mx=Math.max(...per,1);
  $('stats').innerHTML = `
    <div class="stat"><div class="lbl">Tasks completed</div><div class="val">${done}<span class="of"> / ${ts.length}</span></div>
      <div class="progress"><i style="width:${ts.length?Math.round(done/ts.length*100):0}%"></i></div></div>
    <div class="stat"><div class="lbl">Feedback inbox</div><div class="val">${pend}</div>
      <div class="hint">${pend? 'waiting for the orchestrator' : '<b>clear</b>, nothing waiting'}</div></div>
    <div class="stat"><div class="lbl">Reviews in flight</div><div class="val">${openRev}<span class="of">${reviews.length?` / ${reviews.length}`:''}</span></div>
      <div class="hint">${pipeline()?.reviews?.length ? (openRev ? 'lanes working' : '<b>clear</b>, no open lanes') : 'no pipeline configured'}</div></div>
    <div class="stat"><div class="lbl">Activity · 7 days</div>
      <div class="spark">${per.map((n,i)=>`<i class="${i===6?'hot':''}" style="height:${Math.max(12,n/mx*100)}%" title="${days[i].slice(0,10)}: ${n} events"></i>`).join('')}</div>
      <div class="hint">${per[6]} today · ${humans.size} human${humans.size===1?'':'s'}, ${agents.size} agent${agents.size===1?'':'s'} active</div></div>`;
}

const matches = (txt) => !state.q || txt.toLowerCase().includes(state.q);

// ---------- kanban ----------
function cardHtml(t){
  const kids = reviewKidsOf(t);
  const fb = fbForTask(t); const fbOpen = fb.filter(openFb).length;
  const parent = t.parentTaskId ? tasks().find(x=>x._id===t.parentTaskId) : null;
  const sel = state.sel?.kind==='task' && state.sel.id===t.shortId;
  return `<div class="kcard ${sel?'sel':''}" draggable="true" data-drag="${esc(t.shortId)}" data-task="${esc(t.shortId)}">
    <div class="krow1"><span class="id">${esc(t.shortId)}</span>
      <span class="typ typ-${esc(t.type||'feature')}">${esc(t.type||'feature')}</span>
      ${parent?`<span class="id" title="subtask of ${esc(parent.shortId)}">└ ${esc(parent.shortId)}</span>`:''}
    </div>
    <div class="ttl">${esc(t.title)}</div>
    <div class="kfoot">
      ${kids.length?`<span class="pips" title="${esc(kids.map(k=>`${k.lane??'review'}: ${nice(k.status)}`).join(' · '))}"><span class="plbl">REV</span>${kids.map(k=>`<span class="pip ${pipCls(k.status)}"></span>`).join('')}</span>`:''}
      ${fb.length?`<span class="fbn ${fbOpen?'warn':''}" title="${fb.length} feedback, ${fbOpen} open">${ICONS.feedback}${fbOpen||fb.length}</span>`:''}
      ${t.blocker?`<span class="typ" style="color:var(--red);border-color:var(--red);background:var(--red-pale)" title="${esc(t.blocker)}">BLK</span>`:''}
      <span style="flex:1"></span>
      ${t.assignee?`<span class="who ${esc(t.assigneeType)}"><span class="a">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:''}
    </div></div>`;
}

function renderKanban(){
  const visible = tasks().filter(t=>t.type!=='review' && t.status!=='cancelled' && matches(t.title+' '+t.shortId+' '+(t.assignee||'')));
  $('kanban').innerHTML = KANBAN_COLS.map(col=>{
    const cards = visible.filter(t=>t.status===col);
    let shown = cards, toggle = '';
    if (col==='done'){
      shown = [...cards].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
      if (cards.length>5){
        toggle = `<button class="kmore" data-done-toggle>${state.doneExpanded?'show latest 5':`show all ${cards.length}`}</button>`;
        if (!state.doneExpanded) shown = shown.slice(0,5);
      }
    }
    return `<div class="kcol ${cards.length?'':'slim'}" data-col="${col}">
      <div class="khead">${nice(col)}<span class="n">${cards.length}</span></div>
      <div class="kcards" data-col="${col}">${shown.map(cardHtml).join('') || `<div class="kempty">—</div>`}</div>
      ${toggle}</div>`;
  }).join('');
}

// ---------- content (list / feedback / activity / lane) ----------
function taskRowHtml(t, isSub){
  const kids = childrenOf(t);
  const revKids = reviewKidsOf(t);
  const fb = fbForTask(t); const fbOpen = fb.filter(openFb).length;
  const sel = state.sel?.kind==='task' && state.sel.id===t.shortId;
  const caret = kids.length
    ? `<button class="caret ${state.collapsed.has(t.shortId)?'':'openc'}" data-caret="${esc(t.shortId)}" title="${kids.length} subtask${kids.length>1?'s':''}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m9 5 7 7-7 7"/></svg></button>`
    : '<span></span>';
  return `<div class="trow ${isSub?'sub':''} ${sel?'sel':''}" data-task="${esc(t.shortId)}">
    ${caret}
    <span class="id">${esc(t.shortId)}</span>
    <span class="col"><div class="ttl">${esc(t.title)}</div></span>
    <span class="rmeta">
      ${revKids.length?`<span class="pips" title="${esc(revKids.map(k=>`${k.lane??'review'}: ${nice(k.status)}`).join(' · '))}"><span class="plbl">REV</span>${revKids.map(k=>`<span class="pip ${pipCls(k.status)}"></span>`).join('')}</span>`:''}
      ${fb.length?`<span class="fbn ${fbOpen?'warn':''}" title="${fb.length} feedback, ${fbOpen} open">${ICONS.feedback}${fbOpen||fb.length}</span>`:''}
      ${t.type&&t.type!=='feature'?`<span class="typ typ-${esc(t.type)}">${esc(t.type)}</span>`:''}
      ${t.assignee?`<span class="who ${esc(t.assigneeType)}"><span class="a">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:''}
      <span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span>
    </span></div>`;
}

function renderContent(){
  const board = state.view==='board';
  $('kanban').hidden = !board;
  $('content').hidden = board;
  if (board){ renderKanban(); return; }

  const vb = $('viewbar'); const el = $('list');
  if (state.view==='list'){
    vb.innerHTML = `<span class="vtitle">All tasks</span><span class="vn">${tasks().length}</span>
      <div class="filters">${['all','active','done'].map(f=>`<button class="seg ${state.taskFilter===f?'on':''}" data-tf="${f}">${f}</button>`).join('')}</div>`;
    let roots = tasks().filter(t=>!t.parentTaskId);
    if (state.taskFilter==='active') roots = roots.filter(t=>!isClosed(t)||childrenOf(t).some(k=>!isClosed(k)));
    if (state.taskFilter==='done') roots = roots.filter(t=>t.status==='done');
    const rows = [];
    for (const t of roots){
      const kids = childrenOf(t).filter(k=>matches(k.title+' '+k.shortId));
      const hit = matches(t.title+' '+t.shortId) || kids.length;
      if (!hit) continue;
      rows.push(taskRowHtml(t,false));
      if (!state.collapsed.has(t.shortId)) rows.push(...kids.map(k=>taskRowHtml(k,true)));
    }
    el.innerHTML = rows.join('') || `<div class="empty">${state.q?`nothing matches “<b>${esc(state.q)}</b>”`:'no tasks yet. the orchestrator will seed them'}</div>`;
  }
  else if (state.view==='lane'){
    const lanes = pipeline()?.reviews ?? [];
    const lane = lanes.find(l=>l.lane===state.lane);
    const list = tasks().filter(t=>t.type==='review'&&t.lane===state.lane&&matches(t.title+' '+t.shortId));
    const openN = list.filter(t=>!isClosed(t)).length;
    vb.innerHTML = `<span class="vtitle">${esc(lane?.label ?? state.lane)} lane</span><span class="vn">${openN} open · manager ${esc(lane?.manager ?? '?')}</span>`;
    el.innerHTML = list.map(t=>taskRowHtml(t,false)).join('') || '<div class="empty">no reviews spawned in this lane yet</div>';
  }
  else if (state.view==='feedback'){
    let list = fbs();
    if (state.fbFilter==='open') list = list.filter(openFb);
    if (state.fbFilter==='closed') list = list.filter(f=>!openFb(f));
    list = list.filter(f=>matches([f.body,f.shortId,f.author,f.taskShortId].join(' ')));
    vb.innerHTML = `<span class="vtitle">Feedback</span><span class="vn">${list.length}</span>
      <div class="filters">${['open','all','closed'].map(f=>`<button class="seg ${state.fbFilter===f?'on':''}" data-fbf="${f}">${f}</button>`).join('')}</div>`;
    el.innerHTML = list.map(f=>{
      const sel = state.sel?.kind==='fb' && state.sel.id===f.shortId;
      return `<div class="frow ${sel?'sel':''}" data-fb="${esc(f.shortId)}">
        <span class="id">${esc(f.shortId)}</span>
        <span class="col"><div class="fbody">${esc(f.body)||'<i style="color:var(--ink-faint)">screenshot only</i>'}</div>
          <div class="fsub"><span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span>
            <span class="typ typ-${esc(f.type)}">${esc(f.type)}</span>
            ${f.taskShortId?`<span class="id">on ${esc(f.taskShortId)}</span>`:'<span class="id">project-level</span>'}
            ${f.attachments?.length?`<span class="id">[${f.attachments.length} img]</span>`:''}</div></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <span class="pill st-${esc(f.status)}">${esc(nice(f.status))}</span>
          <span class="time" title="${new Date(f.createdAt).toLocaleString('en-GB')}">${relTime(f.createdAt)}</span></span>
      </div>`;}).join('') || `<div class="empty">${state.fbFilter==='open'?'inbox clear, nothing open':'no feedback here yet'}</div>`;
  }
  else {
    vb.innerHTML = `<span class="vtitle">Activity</span>`;
    const evs = (state.data.events||[]).filter(e=>matches(e.text));
    const groups = {};
    for (const e of evs){
      const d = new Date(e.at); const today = new Date();
      const key = d.toDateString()===today.toDateString() ? 'Today'
        : d.toDateString()===new Date(today-864e5).toDateString() ? 'Yesterday'
        : d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'});
      (groups[key] ??= []).push(e);
    }
    el.innerHTML = Object.entries(groups).map(([k,list])=>
      `<div class="evgroup">${esc(k)}</div>` + list.map(e=>{
        const m = (e.text||'').match(/^([A-Z]+-(?:FB-)?\d+)/);
        const txt = m ? `<b>${esc(m[1])}</b>${esc(e.text.slice(m[1].length))}` : esc(e.text);
        return `<div class="ev"><span class="t">${new Date(e.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span><span class="b"></span><span class="x">${txt}</span></div>`;
      }).join('')).join('') || '<div class="empty">quiet so far</div>';
  }
}

// ---------- drawer ----------
function renderDrawer(){
  const dr = $('drawer');
  const backBtn = `<button class="iconbtn" id="dback" ${state.stack.length<2?'disabled':''} title="Back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5m6-7-7 7 7 7"/></svg></button>`;
  const closeBtn = `<button class="iconbtn" id="dclose" title="Close">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

  if (!state.sel){
    dr.classList.remove('open');
    dr.innerHTML = `<div class="dempty"><div>
      <div class="big"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></div>
      select a task or feedback<br>to see everything connected to it</div></div>`;
    $('scrim').classList.remove('on');
    return;
  }
  dr.classList.add('open'); $('scrim').classList.add('on');

  if (state.sel.kind==='task'){
    const t = byShort(state.sel.id); if(!t){ state.sel=null; return renderDrawer(); }
    const kids = childrenOf(t), fb = fbForTask(t), parent = t.parentTaskId ? tasks().find(x=>x._id===t.parentTaskId) : null;
    const revKids = reviewKidsOf(t);
    const evs = eventsForTask(t).slice(0,8);
    const laneInfo = t.type==='review' ? (pipeline()?.reviews??[]).find(l=>l.lane===t.lane) : null;
    dr.innerHTML = `
      <div class="dhead">${backBtn}<span class="id">${esc(t.shortId)}</span>
        <span class="typ typ-${esc(t.type||'feature')}">${esc(t.type||'feature')}</span>
        <span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span><span class="grow"></span>${closeBtn}</div>
      <div class="dbody">
        ${parent?`<div class="note">${t.type==='review'?'review lane of':'subtask of'} <a href="#" data-go-task="${esc(parent.shortId)}">${esc(parent.shortId)} · ${esc(parent.title)}</a></div>`:''}
        <div class="dtitle">${esc(t.title)}</div>
        ${t.description?`<p style="color:var(--ink-soft);margin-top:6px">${esc(t.description)}</p>`:''}
        <div class="dgrid">
          <span class="k">Assignee</span><span>${t.assignee?`<span class="who ${esc(t.assigneeType)}"><span class="a">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:'<span style="color:var(--ink-faint)">unassigned</span>'}</span>
          ${t.lane?`<span class="k">Lane</span><span class="id">${esc(t.lane)}${laneInfo?` · manager ${esc(laneInfo.manager)}`:''}</span>`:''}
          ${t.origin?`<span class="k">Origin</span><span>${esc(t.origin)}</span>`:''}
          ${t.blocker?`<span class="k">Blocked by</span><span style="color:var(--red);font-weight:600">${esc(t.blocker)}</span>`:''}
          <span class="k">Created</span><span title="${new Date(t.createdAt).toLocaleString('en-GB')}">${relTime(t.createdAt)}</span>
          <span class="k">Updated</span><span title="${new Date(t.updatedAt).toLocaleString('en-GB')}">${relTime(t.updatedAt)}</span>
        </div>
        ${t.notes?`<div class="dsec"><h3>Notes</h3><div class="quote">${esc(t.notes)}</div></div>`:''}
        ${revKids.length?`<div class="dsec"><h3>Review lanes · ${revKids.filter(isClosed).length}/${revKids.length} closed</h3>
          <div class="mini">${revKids.map(k=>`<div class="trow" data-task="${esc(k.shortId)}"><span></span><span class="id">${esc(k.shortId)}</span>
            <span class="col"><div class="ttl">${esc(k.title)}</div></span><span class="rmeta">${k.assignee?`<span class="who agent"><span class="a">${esc(initials(k.assignee))}</span>${esc(k.assignee)}</span>`:''}<span class="pill st-${esc(k.status)}">${esc(nice(k.status))}</span></span></div>`).join('')}</div>
          ${pipeline()?.autoAdvance!==false?'<div class="note">auto-advance on: this task moves out of in review when the last lane closes</div>':'<div class="note">auto-advance off: needs an explicit push once lanes close</div>'}</div>`:''}
        ${kids.filter(k=>k.type!=='review').length?`<div class="dsec"><h3>Subtasks · ${kids.filter(k=>k.type!=='review'&&k.status==='done').length}/${kids.filter(k=>k.type!=='review').length} done</h3>
          <div class="mini">${kids.filter(k=>k.type!=='review').map(k=>`<div class="trow" data-task="${esc(k.shortId)}"><span></span><span class="id">${esc(k.shortId)}</span>
            <span class="col"><div class="ttl">${esc(k.title)}</div></span><span class="pill st-${esc(k.status)}">${esc(nice(k.status))}</span></div>`).join('')}</div></div>`:''}
        <div class="dsec"><h3>Feedback on this task · ${fb.filter(openFb).length} open</h3>
          ${fb.length?`<div class="mini">${fb.map(f=>`<div class="frow" data-fb="${esc(f.shortId)}"><span class="id">${esc(f.shortId)}</span>
            <span class="col"><div class="fbody">${esc(f.body)}</div><div class="fsub"><span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span></div></span>
            <span class="pill st-${esc(f.status)}">${esc(nice(f.status))}</span></div>`).join('')}</div>`
          :'<div class="note">none yet. DM Gabbar with “'+esc(t.shortId)+' …” to file the first</div>'}</div>
        ${t.commits?.length?`<div class="dsec"><h3>Commits</h3><div class="commits">${t.commits.map(c=>`<span>· ${esc(c)}</span>`).join('')}</div></div>`:''}
        ${evs.length?`<div class="dsec"><h3>History</h3><div class="devents">${evs.map(e=>`<div><div class="t">${new Date(e.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>${esc(e.text)}</div>`).join('')}</div></div>`:''}
      </div>`;
  } else {
    const f = fbByShort(state.sel.id); if(!f){ state.sel=null; return renderDrawer(); }
    const t = f.taskId ? tasks().find(x=>x._id===f.taskId) : null;
    const FLOW = ['pending','triaged','accepted','in_progress','resolved'];
    const idx = FLOW.indexOf(f.status);
    const flow = f.status==='rejected'
      ? FLOW.slice(0,2).map(s=>`<span class="step hit">${nice(s)}</span><span class="arrow">→</span>`).join('')+`<span class="step bad">rejected</span>`
      : FLOW.map((s,i)=>`<span class="step ${i<idx?'hit':i===idx?(s==='resolved'?'hit':'now'):''}">${nice(s)}</span>`).join('<span class="arrow">→</span>');
    dr.innerHTML = `
      <div class="dhead">${backBtn}<span class="id">${esc(f.shortId)}</span><span class="pill st-${esc(f.status)}">${esc(nice(f.status))}</span><span class="grow"></span>${closeBtn}</div>
      <div class="dbody">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">
          <span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span>
          <span class="typ typ-${esc(f.type)}">${esc(f.type)}</span>
          <span class="time" title="${new Date(f.createdAt).toLocaleString('en-GB')}">${relTime(f.createdAt)}</span>
        </div>
        <div class="quote">${esc(f.body)||'<i>screenshot only</i>'}</div>
        ${f.attachments?.length?`<div class="shots">${f.attachments.filter(safeUrl).map(a=>`<a href="${esc(a)}" target="_blank"><img src="${esc(a)}" alt="attachment"></a>`).join('')}</div>`:''}
        ${f.slack?'<div class="note">came in via Slack. every status change below replies in that thread</div>':''}
        <div class="dsec"><h3>Lifecycle</h3><div class="flow">${flow}</div></div>
        ${f.resolution?`<div class="dsec"><h3>${f.status==='rejected'?'Reason':'Resolution'}</h3>
          <div class="resol ${f.status==='rejected'?'neg':''}">${esc(f.resolution)}</div></div>`:''}
        <div class="dsec"><h3>Task</h3>
          ${t?`<div class="taskcard" data-task="${esc(t.shortId)}">
              <span class="id">${esc(t.shortId)}</span><span class="col" style="flex:1"><div class="ttl">${esc(t.title)}</div></span>
              <span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span></div>`
          :'<div class="note">filed at project level. the orchestrator will attach or promote it</div>'}
          ${f.resolvedTaskShortId&&f.resolvedTaskShortId!==t?.shortId?`<div class="note" style="margin-top:6px">handled by <a href="#" data-go-task="${esc(f.resolvedTaskShortId)}">${esc(f.resolvedTaskShortId)}</a></div>`:''}</div>
      </div>`;
  }
}

// ---------- selection / navigation ----------
function select(kind, id, push=true){
  if (state.sel && state.sel.kind===kind && state.sel.id===id) { renderDrawer(); return; }
  state.sel = {kind, id};
  if (push) state.stack.push(state.sel);
  history.replaceState(null,'',`#/${kind==='task'?'t':'f'}/${id}`);
  renderContent(); renderDrawer();
}
function clearSel(){
  state.sel=null; state.stack=[];
  history.replaceState(null,'',location.pathname);
  renderContent(); renderDrawer();
}
function goBack(){
  if (state.stack.length<2) return;
  state.stack.pop();
  const prev = state.stack[state.stack.length-1];
  state.sel = prev;
  history.replaceState(null,'',`#/${prev.kind==='task'?'t':'f'}/${prev.id}`);
  renderContent(); renderDrawer();
}
function applyHash(){
  const m = location.hash.match(/^#\/(t|f)\/([A-Za-z0-9-]+)$/);
  if (m) { state.sel={kind:m[1]==='t'?'task':'fb', id:m[2].toUpperCase()}; state.stack=[state.sel]; }
}
function setView(v, lane=null){
  state.view = v; state.lane = lane;
  document.body.dataset.view = v;
  renderTopNav(); renderContent(); renderDrawer();
}

// ---------- drag & drop (status moves; server enforces gates, tunnel viewers get 403) ----------
let dragging = null;
document.addEventListener('dragstart', e=>{
  const c = e.target.closest?.('[data-drag]'); if(!c) return;
  dragging = c.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragging);
  requestAnimationFrame(()=>c.classList.add('ghost'));
});
document.addEventListener('dragend', e=>{
  dragging = null;
  document.querySelectorAll('.kcard.ghost').forEach(x=>x.classList.remove('ghost'));
  document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over'));
});
document.addEventListener('dragover', e=>{
  const col = e.target.closest?.('.kcol'); if(!col || !dragging) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', async e=>{
  const col = e.target.closest?.('.kcol'); if(!col || !dragging) return;
  e.preventDefault();
  const id = dragging, status = col.dataset.col;
  const t = byShort(id);
  col.classList.remove('over');
  if (!t || t.status === status) return;
  try {
    const r = await fetch(`/api/tasks/${id}`, {
      method:'PATCH', headers:{'content-type':'application/json'}, body: JSON.stringify({status}),
    });
    if (!r.ok){
      const j = await r.json().catch(()=>({}));
      toast(j.error || (r.status===403 ? 'this board is read-only through the share link' : `move failed (http ${r.status})`));
    } else if (status==='in_review' && (pipeline()?.reviews??[]).length){
      toast(`${id} → in review · spawning ${(pipeline().reviews).length} review lane${pipeline().reviews.length>1?'s':''}`);
    }
  } catch { toast('move failed: network'); }
  load();
});

// ---------- events ----------
document.addEventListener('click', e=>{
  const vbtn = e.target.closest('[data-view-btn]');
  if (vbtn){ setView(vbtn.dataset.viewBtn); return; }
  const lbtn = e.target.closest('[data-lane-btn]');
  if (lbtn){ setView('lane', lbtn.dataset.laneBtn); return; }
  const caret = e.target.closest('[data-caret]');
  if (caret){ e.stopPropagation();
    const id = caret.dataset.caret;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    renderContent(); return; }
  const goTask = e.target.closest('[data-go-task]');
  if (goTask){ e.preventDefault(); select('task', goTask.dataset.goTask); return; }
  const tr = e.target.closest('[data-task]');
  if (tr){ select('task', tr.dataset.task); return; }
  const fr = e.target.closest('[data-fb]');
  if (fr){ select('fb', fr.dataset.fb); return; }
  const fbf = e.target.closest('[data-fbf]');
  if (fbf){ state.fbFilter = fbf.dataset.fbf; renderContent(); return; }
  const tf = e.target.closest('[data-tf]');
  if (tf){ state.taskFilter = tf.dataset.tf; renderContent(); return; }
  const dt = e.target.closest('[data-done-toggle]');
  if (dt){ state.doneExpanded = !state.doneExpanded; renderContent(); return; }
  if (e.target.closest('#dback')) return goBack();
  if (e.target.closest('#dclose')) return clearSel();
  if (e.target.id==='scrim') return clearSel();
});
$('q').addEventListener('input', e=>{ state.q = e.target.value.trim().toLowerCase(); renderContent(); });
document.addEventListener('keydown', e=>{
  if ((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); $('q').focus(); $('q').select(); }
  if (e.key==='Escape'){ if (document.activeElement===$('q')) { $('q').blur(); } else clearSel(); }
});

// ---------- data flow ----------
async function load(){
  const r = await fetch(`/api/p/${capId}`);
  if (!r.ok){ $('list').innerHTML = '<div class="empty">board not found. check the link</div>'; return; }
  state.data = await r.json();
  render();
}
let reloadT;
const es = new EventSource(`/api/p/${capId}/stream`);
es.addEventListener('message', ()=>{ clearTimeout(reloadT); reloadT=setTimeout(load, 250); });
es.onopen = ()=> $('livedot')?.classList.remove('off');
es.onerror = ()=> $('livedot')?.classList.add('off');

applyHash();
if (state.sel) state.view = 'list'; // deep links land on the flat list where the row is visible
document.body.dataset.view = state.view;
load();
</script>
</body>
</html>
