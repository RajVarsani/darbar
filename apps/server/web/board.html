          :'<div class="note">none yet. DM Gabbar with “'+esc(t.shortId)+' …” to file the first</div>'}</div>
        ${t.commits?.length?`<div class="dsec"><h3>Commits</h3><div class="commits">${t.commits.map(c=>`<span>· ${esc(c)}</span>`).join('')}</div></div>`:''}
        ${evs.length?`<div class="dsec"><h3>History</h3><div class="devents">${evs.map(e=>`<div><div class="t">${new Date(e.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>${esc(e.text)}</div>`).join('')}</div></div>`:''}
      </div>`;
  } else {
    const f = fbByShort(state.sel.id); if(!f){ state.sel=null; return renderDrawer(); }
    const t = f.taskId ? tasks().find(x=>x._id===f.taskId) : null;
    const FLOW = ['pending','triaged','accepted','in_progress','resolved'];
    const idx = FLOW.indexOf(f.status);
    const flow = f.status==='rejected'
      ? FLOW.slice(0,2).map(s=>`<span class="step hit">${fbLabel(s)}</span><span class="arrow">→</span>`).join('')+`<span class="step bad">${fbLabel('rejected')}</span>`
      : FLOW.map((s,i)=>`<span class="step ${i<idx?'hit':i===idx?(s==='resolved'?'hit':'now'):''}">${fbLabel(s)}</span>`).join('<span class="arrow">→</span>');
    dr.innerHTML = `
      <div class="dhead">${backBtn}<span class="id">${esc(f.shortId)}</span><span class="pill st-${esc(f.status)}">${esc(fbLabel(f.status))}</span><span class="grow"></span>${closeBtn}</div>
      <div class="dbody">
        <div class="dbadges">
          <span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span>
          <span class="typ typ-${esc(f.type)}">${esc(f.type)}</span>
          <span class="time" title="${new Date(f.createdAt).toLocaleString('en-GB')}">${relTime(f.createdAt)}</span>
        </div>
        <div class="quote md">${mdBlocks(f.body)||'<i>screenshot only</i>'}</div>
        ${f.attachments?.length?`<div class="shots">${f.attachments.filter(safeUrl).map(a=>`<a href="${esc(a)}" target="_blank"><img src="${esc(a)}" alt="attachment"></a>`).join('')}</div>`:''}
        ${f.slack?'<div class="note">came in via Slack. every status change below replies in that thread</div>':''}
        <div class="dsec"><h3>Lifecycle</h3><div class="flow">${flow}</div></div>
        ${f.resolution?`<div class="dsec"><h3>${f.status==='rejected'?'Reason':'Resolution'}</h3>
          <div class="resol md ${f.status==='rejected'?'neg':''}">${mdBlocks(f.resolution)}</div></div>`:''}
        <div class="dsec"><h3>Task</h3>
          ${t?`<div class="taskcard" data-task="${esc(t.shortId)}">
              <span class="id">${esc(t.shortId)}</span><span class="col" style="flex:1"><div class="ttl">${esc(t.title)}</div></span>
              <span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span></div>`
          :'<div class="note">filed at project level. the orchestrator will attach or promote it</div>'}
          ${f.resolvedTaskShortId&&f.resolvedTaskShortId!==t?.shortId?`<div class="note" style="margin-top:6px">handled by <a href="#" data-go-task="${esc(f.resolvedTaskShortId)}">${esc(f.resolvedTaskShortId)}</a></div>`:''}</div>
      </div>`;
  }
}

// ---------- command palette (⌘K) ----------
// keyboard route to the config panel — secondary path; the people stack is the pointer one
const PAL_CONFIG = {kind:'config', id:'CONFIG', text:'Project config · stakeholders, agents, pipeline, repos, charter',
  keys:'project config settings stakeholders humans agents pipeline lanes repos charter'};
function palResults(){
  const q = state.pal.q;
  const hit = s => String(s??'').toLowerCase().includes(q);
  const cfg = (!q || hit(PAL_CONFIG.keys)) ? [PAL_CONFIG] : [];
  let ts = tasks(), fs = fbs();
  if (q){
    ts = ts.filter(t=>hit(t.shortId)||hit(t.title)||hit(t.description)||hit(t.assignee)||hit(t.lane));
    fs = fs.filter(f=>hit(f.shortId)||hit(f.body)||hit(f.author)||hit(f.taskShortId));
  } else {
    ts = [...ts].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
    fs = [...fs].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  }
  return [
    ...cfg,
    ...ts.slice(0,8).map(t=>({kind:'task', id:t.shortId, text:t.title, status:t.status})),
    ...fs.slice(0,8).map(f=>({kind:'fb', id:f.shortId, text:f.body||'screenshot only', status:f.status})),
  ];
}
function renderPal(){
  const wrap = $('pal');
  wrap.hidden = !state.pal.open;
  if (!state.pal.open) return;
  const rows = palResults();
  if (state.pal.sel >= rows.length) state.pal.sel = Math.max(0, rows.length-1);
  const pill = r => r.kind==='config' ? '<span class="pill">PANEL</span>'
    : `<span class="pill st-${esc(r.status)}">${esc(r.kind==='fb'?fbLabel(r.status):nice(r.status))}</span>`;
  // a feedback snippet is markdown source on one ellipsised line: same flattener as the list rows,
  // so the palette and the row it jumps to read the same. Titles are plain text already.
  const rowHtml = (r,i) => `<div class="palrow ${i===state.pal.sel?'selp':''}" data-pal-row="${i}">
    <span class="id">${esc(r.id)}</span><span class="snippet">${r.kind==='fb'?mdText(r.text):esc(r.text)}</span>
    ${pill(r)}</div>`;
  const group = (label, kind) => {
    const parts = rows.map((r,i)=>r.kind===kind?rowHtml(r,i):'').filter(Boolean);
    return parts.length ? `<div class="palgroup">${label}</div>`+parts.join('') : '';
  };
  $('palresults').innerHTML = rows.length
    ? group('Project','config') + group('Tasks','task') + group('Feedback','fb')
    : `<div class="palempty">no matches for “${esc(state.pal.q)}”</div>`;
  document.querySelector('.palrow.selp')?.scrollIntoView({block:'nearest'});
}
function openPal(){
  state.pal = {open:true, q:'', sel:0};
  const inp = $('palq'); inp.value = '';
  renderPal(); inp.focus();
}
function closePal(){ state.pal.open = false; renderPal(); }
function palGo(r){
  closePal();
  if (r.kind==='config'){ select('config'); return; } // config overlays whatever view is under it
  if (r.kind==='fb'){ if (state.view!=='feedback') setView('feedback'); }
  else if (state.view==='feedback'||state.view==='activity') setView('board'); // drawer overlays everywhere else
  select(r.kind, r.id);
}

// ---------- selection / navigation ----------
function select(kind, id, push=true){
  if (state.sel && state.sel.kind===kind && state.sel.id===id) { renderDrawer(); return; }
  state.sel = {kind, id};
  if (push) state.stack.push(state.sel);
  const hash = kind==='config' ? '#/config' : `#/${kind==='task'?'t':'f'}/${id}`;
  if (location.hash !== hash) history.pushState(null,'',hash); // real entries so browser back/forward walk drawers
  renderContent(); renderDrawer();
}
function clearSel(){
  state.sel=null; state.stack=[];
  history.replaceState(null,'',location.pathname);
  renderContent(); renderDrawer();
}
function goBack(){
  if (state.stack.length<2) return;
  history.back(); // one history model: hashchange pops the stack and renders
}
const parseHash = () => {
  if (location.hash === '#/config') return {kind:'config'};
  const m = location.hash.match(/^#\/(t|f)\/([A-Za-z0-9-]+)$/);
  return m ? {kind: m[1]==='t'?'task':'fb', id: m[2].toUpperCase()} : null;
};
function applyHash(){
  const t = parseHash();
  if (t) { state.sel=t; state.stack=[t]; }
}
// browser back/forward (and the drawer back button, via history.back) drive the drawer
window.addEventListener('hashchange', ()=>{
  const target = parseHash();
  if (target){
    const same = state.sel && state.sel.kind===target.kind && state.sel.id===target.id;
    const prev = state.stack[state.stack.length-2];
    if (prev && prev.kind===target.kind && prev.id===target.id) state.stack.pop(); // back
    else if (!same) state.stack.push(target);                                     // forward / new hop
    state.sel = target;
    // restore the view under the drawer (mirror palGo); config overlays any view as-is
    if (target.kind==='fb'){ if (state.view!=='feedback') return setView('feedback'); }
    else if (target.kind==='task' && (state.view==='feedback'||state.view==='activity')) return setView('board');
  } else { state.sel = null; state.stack = []; }
  renderContent(); renderDrawer();
});
function setView(v, lane=null){
  state.view = v; state.lane = lane;
  document.body.dataset.view = v;
  renderTopNav(); renderStats(); renderContent(); renderDrawer();
}

// ---------- drag & drop (status moves; server enforces gates, tunnel viewers get 403) ----------
let dragging = null;
document.addEventListener('dragstart', e=>{
  const c = e.target.closest?.('[data-drag]'); if(!c) return;
  dragging = c.dataset.drag;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragging);
  requestAnimationFrame(()=>c.classList.add('ghost'));
});
document.addEventListener('dragend', e=>{
  dragging = null;
  document.querySelectorAll('.kcard.ghost').forEach(x=>x.classList.remove('ghost'));
  document.querySelectorAll('.kcol.over').forEach(x=>x.classList.remove('over'));
});
document.addEventListener('dragover', e=>{
  const col = e.target.closest?.('.kcol'); if(!col || !dragging) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.kcol.over').forEach(x=>x!==col&&x.classList.remove('over'));
  col.classList.add('over');
});
document.addEventListener('drop', async e=>{
  const col = e.target.closest?.('.kcol'); if(!col || !dragging) return;
  e.preventDefault();
  const id = dragging, status = col.dataset.col;
  const t = byShort(id);
  col.classList.remove('over');
  if (!t || t.status === status) return;
  try {
    const r = await fetch(`/api/tasks/${id}`, {
      method:'PATCH', headers:{'content-type':'application/json'}, body: JSON.stringify({status}),
    });
    if (!r.ok){
      const j = await r.json().catch(()=>({}));
      toast(j.error || (r.status===403 ? 'this board is read-only through the share link' : `move failed (http ${r.status})`));
    } else if (status==='in_review' && pipeLanes().length){
      // routable lanes only: that is the count that actually spawns
      toast(`${id} → in review · spawning ${pipeLanes().length} review lane${pipeLanes().length>1?'s':''}`);
    }
  } catch { toast('move failed: network'); }
  load();
});

// ---------- events ----------
document.addEventListener('click', e=>{
  if (e.target.closest('#qbtn')){ openPal(); return; }
  if (e.target.closest('[data-open-config]')){ select('config'); return; }
  const pr = e.target.closest('[data-pal-row]');
  if (pr){ const r = palResults()[+pr.dataset.palRow]; if (r) palGo(r); return; }
  if (e.target.closest('[data-pal-close]')){ closePal(); return; }
  const vbtn = e.target.closest('[data-view-btn]');
  if (vbtn){ setView(vbtn.dataset.viewBtn); return; }
  const lbtn = e.target.closest('[data-lane-btn]');
  if (lbtn){ setView('lane', lbtn.dataset.laneBtn); return; }
  const caret = e.target.closest('[data-caret]');
  if (caret){ e.stopPropagation();
    const id = caret.dataset.caret;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    renderContent(); return; }
  const goTask = e.target.closest('[data-go-task]');
  if (goTask){ e.preventDefault(); select('task', goTask.dataset.goTask); return; }
  const goFb = e.target.closest('[data-go-fb]');
  if (goFb){ e.preventDefault(); if (state.view!=='feedback') setView('feedback'); select('fb', goFb.dataset.goFb); return; }
  const tr = e.target.closest('[data-task]');
  if (tr){ select('task', tr.dataset.task); return; }
  const fr = e.target.closest('[data-fb]');
  if (fr){ select('fb', fr.dataset.fb); return; }
  const fbf = e.target.closest('[data-fbf]');
  if (fbf){ state.fbFilter = fbf.dataset.fbf; renderContent(); return; }
  const tf = e.target.closest('[data-tf]');
  if (tf){ state.taskFilter = tf.dataset.tf; renderContent(); return; }
  const dt = e.target.closest('[data-done-toggle]');
  if (dt){ state.doneExpanded = !state.doneExpanded; renderContent(); return; }
  // one toggle for every foldable column, keyed by the column itself, so the two fold states are
  // independent by construction rather than by remembering to keep two flags apart
  const fd = e.target.closest('[data-fold]');
  if (fd){ const col = fd.dataset.fold;
    state.folded.has(col) ? state.folded.delete(col) : state.folded.add(col);
    renderContent(); return; }
  // the shared link is meant to be handed to someone: confirm in place, and re-render safely
  const cp = e.target.closest('[data-copy]');
  if (cp){ copyLink(cp); return; }
  if (e.target.closest('#dback')) return goBack();
  if (e.target.closest('#dclose')) return clearSel();
  if (e.target.id==='scrim') return clearSel();
});
$('palq').addEventListener('input', e=>{ state.pal.q = e.target.value.trim().toLowerCase(); state.pal.sel = 0; renderPal(); });
document.addEventListener('keydown', e=>{
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); state.pal.open ? closePal() : openPal(); return; }
  if (state.pal.open){
    if (e.key==='Escape'){ e.preventDefault(); closePal(); return; }
    if (e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const n = palResults().length; if (!n) return;
      state.pal.sel = (state.pal.sel + (e.key==='ArrowDown'?1:n-1)) % n;
      renderPal(); return;
    }
    if (e.key==='Enter'){ e.preventDefault(); const r = palResults()[state.pal.sel]; if (r) palGo(r); return; }
    return;
  }
  if (e.key==='Escape') clearSel();
});

// ---------- data flow ----------
async function load(){
  const r = await fetch(`/api/p/${capId}`);
  if (!r.ok){ $('list').innerHTML = '<div class="empty">board not found. check the link</div>'; return; }
  state.data = await r.json();
  render();
}
$('refresh').addEventListener('click', ()=>load());
let reloadT, esDropped = false;
const es = new EventSource(`/api/p/${capId}/stream`);
es.addEventListener('message', ()=>{ clearTimeout(reloadT); reloadT=setTimeout(load, 250); });
es.onopen = ()=>{ $('livedot')?.classList.remove('off'); if (esDropped){ esDropped=false; load(); } }; // catch up after a drop
es.onerror = ()=>{ esDropped=true; $('livedot')?.classList.add('off'); };

// see tickDispatchAges: the stamps are re-cut in place, so this runs in every view and is safe
// mid-drag and with a drawer open.
setInterval(()=>{ if (tasks().some(dispatchPending)) tickDispatchAges(); }, 60000);

// column widths are measured (colMin), so a resized window has to re-measure or the board keeps a
// minimum the window no longer has
let resizeT;
addEventListener('resize', ()=>{ clearTimeout(resizeT); resizeT = setTimeout(()=>{
  if (state.view==='board' && !dragging) renderKanban();
}, 150); });

applyHash();
if (state.sel?.kind==='fb') state.view = 'feedback'; // fb deep links land in context; task links stay on board (drawer overlays)
document.body.dataset.view = state.view;
load();
</script>
