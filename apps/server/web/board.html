<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Darbar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1c1c'/%3E%3Cpath fill-rule='evenodd' d='M8 7h8.5c5 0 7.5 3.8 7.5 9s-2.5 9-7.5 9H8V7zm4.5 4.5v9H16c2.6 0 3.7-1.7 3.7-4.5s-1.1-4.5-3.7-4.5h-3.5z' fill='%23d8ff7c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lime:#d8ff7c;          /* the one surface */
    --ink:#1c1c1c;           /* text + borders */
    --beige:#eae5db;         /* raised components */
    --beige-2:#f2eee6;       /* lighter inset rows */
    --ink-soft:rgba(28,28,28,.55);
    --ink-faint:rgba(28,28,28,.35);
    --hair:rgba(28,28,28,.16);
    --green-deep:#133f26;    /* ink-on-lime accents */
    --green:#2d8654;         /* success */
    --green-pale:#eaf5ec;
    --red:#7a2a20;           /* danger */
    --red-pale:#f5e6e3;
    --sans:'IBM Plex Sans',-apple-system,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;

    /* ONE species encoding, used by every surface: ink round = human, green square = agent.
       Top bar (.ava) and panel (.who .a) both read from these — never restyle a species locally. */
    --human-bg:#1c1c1c; --human-fg:#d8ff7c; --human-line:#1c1c1c;
    --agent-bg:#2d8654; --agent-fg:#ffffff; --agent-line:#133f26;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html{height:100%}
  body{min-height:100%;background:var(--lime);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
  a{color:var(--green-deep);text-decoration:underline;text-underline-offset:2px}
  ::selection{background:var(--ink);color:var(--lime)}

  /* ---------- brand ---------- */
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
  .brand .dot{width:24px;height:24px;background:var(--ink);color:var(--lime);display:grid;place-items:center;
    font-size:13px;font-weight:800}

  .live{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:var(--green-deep)}
  .live::before{content:"";width:8px;height:8px;background:var(--green);border:1.5px solid var(--ink);animation:pulse 2.2s infinite}
  .live.off{color:var(--ink-soft)} .live.off::before{background:var(--beige);animation:none}
  @keyframes pulse{50%{opacity:.25}}

  /* ---------- top bar: one sticky header, two stacked rows ---------- */
  .top{position:sticky;top:0;z-index:30;background:var(--lime);border-bottom:2px solid var(--ink)}
  .toprow{display:flex;align-items:center;gap:16px;padding:0 24px;height:54px;border-bottom:1.5px solid var(--hair)}
  .toprow2{height:44px;gap:10px;border-bottom:none;overflow-x:auto}
  .views,.lanes{display:flex;align-items:center;gap:4px}
  .lanes{gap:8px}
  .vtab{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;
    padding:5px 11px;border:2px solid transparent;color:var(--ink-soft);transition:.08s;white-space:nowrap}
  .vtab:hover{border-color:var(--ink);color:var(--ink)}
  .vtab.on{background:var(--ink);color:var(--lime)}
  .vtab svg,.lanechip svg{flex:none}
  .vtab .n,.lanechip .n{font-size:10px;font-weight:800;background:var(--beige);border:1.5px solid var(--ink);
    color:var(--ink);padding:0 5px;min-width:18px;text-align:center}
  .vtab.on .n,.lanechip.on .n{background:var(--lime)}
  .vtab .n.zero,.lanechip .n.zero{opacity:.35}
  .lanechip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;font-weight:700;
    padding:3px 9px;border:2px solid var(--ink);background:var(--beige);color:var(--ink);white-space:nowrap;transition:.08s}
  .lanechip:hover{box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .lanechip.on{background:var(--ink);color:var(--lime);box-shadow:none;transform:none}
  .crumb{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:10px}
  .chip{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--beige);border:2px solid var(--ink);
    padding:1px 7px;letter-spacing:.04em}
  /* an exposed dev server is the one project fact with a consequence outside the tracker, so it
     is stated on the board surface next to the prefix — not only inside a panel you must open */
  .expomark{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;font-weight:800;
    letter-spacing:.08em;text-transform:uppercase;background:var(--red);color:#fff;border:2px solid var(--ink);
    padding:2px 8px;white-space:nowrap;transition:.08s}
  .expomark::before{content:"";width:7px;height:7px;background:#fff;border:1.5px solid var(--ink);
    flex:none;animation:pulse 2.2s infinite}
  .expomark:hover{box-shadow:2px 2px 0 var(--ink);transform:translate(-1px,-1px)}
  .searchwrap{flex:1;display:flex;justify-content:center}
  .search{display:flex;align-items:center;gap:8px;width:min(420px,100%);background:var(--beige);
    border:2px solid var(--ink);padding:6px 12px;color:var(--ink-soft);transition:box-shadow .1s,transform .1s}
  .search:hover,.search:focus-visible{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
  .search svg{flex:none}
  .search .ph{flex:1;text-align:left;font-family:var(--mono);font-size:13px;color:var(--ink-faint);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .search kbd{font-family:var(--mono);font-size:10px;font-weight:700;background:var(--lime);border:1.5px solid var(--ink);
    padding:1px 6px;color:var(--ink)}
  /* one overlapping face-pile, humans then agents. species stays encoded on colour AND
     shape (round human / square agent) — colour alone read as two states of one thing */
  .people{display:flex;align-items:center;gap:0}
  /* --z is emitted per chip, descending: first chip on top, each later one tucks under it.
     DOM paint order alone does the reverse and clips the leading avatar (FB-66). It rides a
     custom property, not an inline z-index, so :hover below can still out-cascade it. */
  .ava{width:26px;height:26px;border:2px solid;display:grid;place-items:center;position:relative;z-index:var(--z,1);
    font-family:var(--mono);font-size:10px;font-weight:800;margin-left:-7px;transition:transform .08s}
  .ava:first-child{margin-left:0}
  .ava.human{background:var(--human-bg);color:var(--human-fg);border-color:var(--human-line);border-radius:50%}
  .ava.agent{background:var(--agent-bg);color:var(--agent-fg);border-color:var(--agent-line)}
  .ava:hover{transform:translateY(-2px);z-index:99} /* clears both neighbours, not just the one under it */
  .pmore{font-family:var(--mono);font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.02em;
    position:relative;z-index:var(--z,1);margin-left:2px;padding-right:1px}
  .pmore + .ava{margin-left:3px} /* the run restarts after an overflow marker; never tuck under the count */
  /* the config entry reads as a button at rest (hairline), not as a plain label */
  .pbtn{border:2px solid rgba(28,28,28,.28);padding:3px 9px;transition:.08s}
  .pbtn:hover{border-color:var(--ink);background:rgba(28,28,28,.06)}
  .pbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--beige);box-shadow:inset 2px 2px 0 var(--ink)}

  /* ---------- page ---------- */
  .page{width:100%;padding:24px 28px 64px}
  h1{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.01em}
  .pagehead{display:flex;align-items:baseline;gap:14px;margin:2px 0 20px;flex-wrap:wrap}
  .pagehead .sub{color:var(--ink-soft);font-family:var(--mono);font-size:12px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
  .stat{background:var(--beige);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:13px 16px}
  .stat .lbl{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .stat .val{font-family:var(--mono);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0 1px}
  .stat .val .of{color:var(--ink-faint);font-size:15px;font-weight:700}
  .stat .hint{font-size:12px;color:var(--ink-soft)}
  .stat .hint b{color:var(--green-deep);font-weight:700}
  .progress{height:8px;border:1.5px solid var(--ink);background:var(--beige-2);margin-top:10px}
  .progress i{display:block;height:100%;background:var(--green);border-right:1.5px solid var(--ink);transition:width .4s}
  .progress i[style*="width: 0%"]{border-right:none}
  .spark{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:8px}
  .spark i{flex:1;background:var(--beige-2);border:1.5px solid var(--ink);min-height:4px;transition:height .3s}
  .spark i.hot{background:var(--lime)}

  /* ---------- kanban ---------- */
  /* tracks are set per render (renderKanban): every status column is an equal 1fr, and a folded
     backlog rail takes only its own width instead of a full column. */
  .kanban{display:grid;grid-template-columns:auto repeat(6,minmax(238px,1fr));gap:14px;overflow-x:auto;
    align-items:start;padding-bottom:10px}
  /* columns narrow to fit the window first (colMin), so this only scrolls when even the floor width
     does not fit — a small window, or a search that leaves seven wide columns. When it does, the hint
     has to be visible: macOS overlay scrollbars vanish, so nothing said Done continued past the right
     edge. This bar is drawn in the board's own ink and shows while there is somewhere to scroll to. */
  .kanban::-webkit-scrollbar{height:10px}
  .kanban::-webkit-scrollbar-track{background:var(--beige-2);border:1.5px solid var(--ink)}
  .kanban::-webkit-scrollbar-thumb{background:var(--ink)}
  .kanban::-webkit-scrollbar-thumb:hover{background:var(--green-deep)}
  .kcol{background:var(--beige);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-width:0}
  .kcol.over{background:var(--lime);outline:2px dashed var(--ink);outline-offset:-7px}
  .khead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:2px solid var(--ink);
    font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
  .khead .n{margin-left:auto;font-size:10px;background:var(--beige-2);border:1.5px solid var(--ink);padding:0 6px;
    font-variant-numeric:tabular-nums}
  .kcards{display:flex;flex-direction:column;gap:10px;padding:10px;min-height:56px;max-height:calc(100vh - 366px);overflow-y:auto}
  .kcard{background:var(--beige-2);border:2px solid var(--ink);padding:9px 11px 10px;cursor:pointer;transition:transform .08s,box-shadow .08s}
  .kcard:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
  .kcard.sel{background:var(--lime)}
  .kcard.ghost{opacity:.35}
  .krow1{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .kcard .ttl{white-space:normal;font-size:13px;font-weight:600;line-height:1.35}
  .kfoot{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .kfoot .who{transform:scale(.95);transform-origin:left center}
  .kempty{padding:14px 12px;text-align:center;color:var(--ink-faint);font-family:var(--mono);font-size:11px}
  /* empty columns go quiet so real work stands out; still a live drop target */
  .kcol.slim{box-shadow:2px 2px 0 var(--ink)}
  .kcol.slim .khead{color:var(--ink-faint)}
  .kcol.slim .khead .n{opacity:.4}
  .kcol.slim .kcards{min-height:34px;padding:6px 10px}
  .kcol.slim .kempty{padding:6px 10px}
  .kcol.slim.over .khead{color:var(--ink)}
  /* the folded rail, used by both ends of the flow (backlog and done): each keeps its own column so
     no other column's count carries uncommitted or finished work, and each folds to a rail by default
     so neither takes width from the work in flight. Still a drop target — dropping a card on the
     backlog rail demotes it, on the done rail ships it (subject to the server's done gate). */
  .kcol.fold{width:44px;min-width:44px}
  .kcol.fold .foldbtn{display:flex;flex-direction:column;align-items:center;gap:9px;width:100%;padding:9px 0 14px;
    font-family:var(--mono);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;
    color:var(--ink-soft);transition:color .08s}
  /* the label is the column name straight from the status, so it capitalises here rather than in
     one hand-written string per rail */
  .kcol.fold .foldbtn .fl{writing-mode:vertical-rl;text-transform:capitalize}
  .kcol.fold .foldbtn .n{font-size:10px;color:var(--ink);background:var(--beige-2);border:1.5px solid var(--ink);
    padding:0 5px;font-variant-numeric:tabular-nums}
  .kcol.fold:hover .foldbtn,.kcol.fold.over .foldbtn{color:var(--ink)}
  .khead .foldx{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);
    border:1.5px solid var(--ink-faint);padding:0 5px}
  .khead .foldx:hover{color:var(--ink);border-color:var(--ink)}

  /* dispatched: handed to an agent, not yet self-reported as started. Always shown WITH its age, and
     it turns red once the age says the builder should have reported by now. */
  .disp{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 5px;
    border:1.5px solid var(--green-deep);color:var(--green-deep);background:var(--beige)}
  .disp.stale{border-color:var(--red);color:var(--red);background:var(--red-pale)}
  /* folded backlog rail: no room for the badge across, so it reads down the rail like the label under
     it, in the badge's own colours */
  .disp.rail{writing-mode:vertical-rl;font-size:9px;padding:5px 1px}
  .kcard.dispatched{box-shadow:inset 4px 0 0 var(--green-deep)}
  .kcard.dispatched:hover{box-shadow:inset 4px 0 0 var(--green-deep),3px 3px 0 var(--ink)}
  .kcard.dispatched.late{box-shadow:inset 4px 0 0 var(--red)}
  .kcard.dispatched.late:hover{box-shadow:inset 4px 0 0 var(--red),3px 3px 0 var(--ink)}

  .kmore{display:block;width:100%;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;padding:5px 12px;color:var(--ink-soft);border-top:2px solid var(--ink);transition:.08s}
  .kmore:hover{background:var(--lime);color:var(--ink)}

  /* review pips: one square per pipeline lane on the parent card */
  .pips{display:inline-flex;gap:3px;align-items:center;padding:3px 6px;border:1.5px solid var(--ink);background:var(--beige)}
  .pips .plbl{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);margin-right:2px}
  .pip{width:9px;height:9px;border:1.5px solid var(--ink);background:var(--beige-2)}
  .pip.p-run{background:var(--lime)}
  .pip.p-done{background:var(--green)}
  .pip.p-blocked{background:var(--red)}
  .pip.p-cancelled{background:var(--ink-faint)}

  /* ---------- content box (list / feedback / activity / lane) ---------- */
  .content{background:var(--beige);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-width:0}
  .viewbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid var(--ink)}
  .viewbar .vtitle{font-family:var(--mono);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .viewbar .vn{font-family:var(--mono);font-size:10px;color:var(--ink-soft);font-weight:700}
  .filters{margin-left:auto;display:flex;border:2px solid var(--ink)}
  .seg{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;padding:4px 12px;
    color:var(--ink-soft);border-right:2px solid var(--ink)}
  .seg:last-child{border-right:none}
  .seg.on{background:var(--lime);color:var(--ink)}

  /* ---------- rows ---------- */
  .list{min-height:300px}
  .trow{display:grid;grid-template-columns:26px 76px minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:11px 16px 11px 10px;border-bottom:1.5px solid var(--hair);cursor:pointer;transition:background .08s}
  .trow:hover{background:var(--beige-2)}
  .trow.sel{background:var(--lime);box-shadow:inset 4px 0 0 var(--ink)}
  .trow:last-child{border-bottom:none}
  .trow.sub .id::before{content:"└ ";color:var(--ink-faint)}
  .trow.sub{grid-template-columns:26px 92px minmax(0,1fr) auto}
  .caret{width:22px;height:22px;display:grid;place-items:center;color:var(--ink-soft);border:1.5px solid transparent}
  .caret:hover{border-color:var(--ink);color:var(--ink)}
  .caret svg{transition:transform .12s}
  .caret.openc svg{transform:rotate(90deg)}
  .id{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
  .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
  .fbn{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink-soft)}
  .fbn.warn{color:var(--green-deep)}

  .frow{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:12px;align-items:start;
    padding:12px 16px;border-bottom:1.5px solid var(--hair);cursor:pointer;transition:background .08s}
  .frow:hover{background:var(--beige-2)}
  .frow.sel{background:var(--lime);box-shadow:inset 4px 0 0 var(--ink)}
  .frow:last-child{border-bottom:none}
  .fbody{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .fsub{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:12px;color:var(--ink-soft);flex-wrap:wrap}
  .frow .col{min-width:0}
  .time{font-family:var(--mono);font-size:11px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* pills + chips — square, bordered, uppercase */
  .pill{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;border:2px solid var(--ink);padding:1.5px 8px;white-space:nowrap;background:var(--beige-2)}
  .st-todo,.st-backlog{color:var(--ink-soft)}
  .st-in_progress,.st-triaged,.st-accepted{background:var(--lime);color:var(--ink)}
  .st-qa,.st-in_review{background:var(--beige-2);color:var(--green-deep);border-color:var(--green-deep)}
  .st-blocked{background:var(--red-pale);color:var(--red);border-color:var(--red)}
  .st-done,.st-resolved{background:var(--green);color:#fff}
  .st-pending,.st-needs_clarification{background:var(--ink);color:var(--lime)}
  .st-rejected,.st-cancelled{color:var(--ink-faint);border-color:var(--ink-faint)}
  .who{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;
    border:2px solid var(--ink);padding:1px 8px 1px 2px;background:var(--beige-2)}
  .who .a{width:16px;height:16px;display:grid;place-items:center;font-size:8.5px;font-weight:800}
  /* same tokens + same shapes as the top-bar .ava chips: ink round = human, green square = agent */
  .who.human .a{background:var(--human-bg);color:var(--human-fg);border-radius:50%}
  .who.agent .a{background:var(--agent-bg);color:var(--agent-fg)}
  .who.agent{border-color:var(--agent-line);color:var(--green-deep)}
  .typ{font-family:var(--mono);font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border:2px solid}
  .typ-bug{color:var(--red);border-color:var(--red);background:var(--red-pale)}
  .typ-design{color:var(--green-deep);border-color:var(--green-deep);background:var(--green-pale)}
  .typ-idea{color:var(--ink);border-color:var(--ink);background:var(--lime)}
  .typ-approval{color:#fff;border-color:var(--ink);background:var(--green)}
  .typ-feature{color:var(--ink);border-color:var(--ink);background:var(--lime)}
  .typ-chore{color:var(--ink-soft);border-color:var(--ink-soft);background:var(--beige-2)}
  .typ-review{color:var(--green-deep);border-color:var(--green-deep);background:var(--green-pale)}
  .typ-regression{color:var(--red);border-color:var(--red);background:var(--red-pale)}
  .typ-lane{color:var(--ink-soft);border-color:var(--ink-soft);background:var(--beige-2)} /* per-task lane selection chip */

  /* ---------- activity ---------- */
  .evgroup{padding:16px 18px 6px;font-family:var(--mono);color:var(--ink-soft);font-size:10.5px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--hair)}
  .ev{display:grid;grid-template-columns:56px 14px minmax(0,1fr);gap:10px;padding:8px 18px;align-items:center;
    border-bottom:1.5px solid var(--hair)}
  .ev:last-child{border-bottom:none}
  .ev .t{font-family:var(--mono);font-size:10.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums;text-align:right}
  .ev .b{position:relative;height:100%}
  .ev .b::before{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:7px;height:7px;background:var(--lime);border:1.5px solid var(--ink)}
  .ev .x{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .x b{color:var(--ink);font-weight:700;font-family:var(--mono);font-size:11.5px}

  /* ---------- drawer: fixed full-height right panel, overlays content on every view ---------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:45;background:var(--beige);
    border-left:2px solid var(--ink);box-shadow:-8px 0 0 rgba(28,28,28,.25);display:flex;flex-direction:column;
    overflow:hidden;transform:translateX(calc(100% + 12px));transition:transform .18s ease}
  .drawer.open{transform:none}
  .dhead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:2px solid var(--ink);background:var(--beige-2)}
  .dhead .grow{flex:1}
  .iconbtn{width:26px;height:26px;display:grid;place-items:center;color:var(--ink);border:2px solid var(--ink);
    background:var(--beige);transition:.08s}
  .iconbtn:hover{background:var(--ink);color:var(--lime)}
  .iconbtn[disabled]{opacity:.3;pointer-events:none}
  .dbody{flex:1;overflow-y:auto;padding:18px 20px 24px}
  .dempty{display:grid;place-items:center;text-align:center;padding:64px 24px;color:var(--ink-soft);font-family:var(--mono);font-size:12.5px}
  .dempty .big{width:44px;height:44px;border:2px solid var(--ink);background:var(--lime);display:grid;place-items:center;margin:0 auto 14px}
  .dtitle{font-family:var(--mono);font-size:17px;font-weight:700;margin:0 0 2px;text-wrap:balance;line-height:1.35}
  /* identity badges live at the top of the body, not in .dhead — the header carries id/state/controls only.
     the 8px below is what binds the badge to its title; never widen it */
  .dbadges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
  /* minmax(0,1fr), never 1fr: a rendered-markdown cell (Blocked by) can hold a fenced code block,
     and 1fr floors the TRACK at the item's min-content, so the pre's longest line widens the whole
     drawer and min-width:0 on the item cannot reach it. Same idiom as .crow. */
  .dgrid{display:grid;grid-template-columns:100px minmax(0,1fr);row-gap:9px;column-gap:12px;margin:14px 0;font-size:13px}
  .dgrid .k{font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-soft);padding-top:2px}
  .dsec{margin-top:22px}
  .dsec>h3{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
  .mini{border:2px solid var(--ink);background:var(--beige-2)}
  .mini .trow,.mini .frow{padding-left:12px}
  .mini .trow.flat{grid-template-columns:auto minmax(0,1fr) auto}
  /* inherited default, not a choice someone made: dashed and recessive so it can never be
     misread as an explicit per-task selection sitting in the same slot */
  .mini.dflt{border-style:dashed;background:var(--beige)}
  .mini.dflt .lname{font-weight:500;color:var(--ink-soft)}
  .lname{font-weight:600}
  /* the lane name is the point of this row: never clip it behind a wide status pill. The meta
     drops to its own line before the name gives up a character. */
  .mini .trow.flat.lanerow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
  /* no min-width floor: a floor makes the wrap decision against itself rather than the title, so
     every row breaks. .ttl's break-word is what prevents the clip. */
  .mini .trow.flat.lanerow .col{flex:1 1 auto;min-width:0}
  .mini .trow.flat.lanerow .ttl{white-space:normal;overflow-wrap:break-word}
  .mini .trow.flat.lanerow .rmeta{margin-left:auto}
  .quote{background:var(--beige-2);border:2px solid var(--ink);padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-weight:500}
  .shots{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .shots a img{width:100px;height:70px;object-fit:cover;border:2px solid var(--ink);transition:.1s;display:block}
  .shots a:hover img{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink)}
  .commits{font-family:var(--mono);font-size:12px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px}
  .taskcard{border:2px solid var(--ink);background:var(--beige-2);padding:11px 13px;cursor:pointer;transition:.1s;
    display:flex;gap:10px;align-items:center}
  .taskcard:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--ink);background:var(--lime)}
  .flow{display:flex;align-items:center;margin-top:4px;flex-wrap:wrap;row-gap:8px}
  .step{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:var(--ink-faint);border:2px solid var(--ink-faint);padding:2px 8px;background:var(--beige-2)}
  .step.hit{background:var(--green);color:#fff;border-color:var(--ink)}
  .step.now{background:var(--ink);color:var(--lime);border-color:var(--ink)}
  .step.bad{background:var(--red);color:#fff;border-color:var(--ink)}
  .arrow{color:var(--ink-faint);margin:0 5px;font-family:var(--mono);font-size:10px}
  .note{font-size:12px;color:var(--ink-soft);margin-top:8px}
  /* leading .note (the parent breadcrumb): the 8px belongs BELOW it, so every drawer opens at the
     same 18px and the type badge separates from the breadcrumb instead of grouping with it */
  .dbody>.note:first-child{margin-top:0;margin-bottom:8px}
  .resol{border:2px solid var(--ink);border-left:6px solid var(--green);background:var(--green-pale);padding:10px 14px;font-weight:500}
  .resol.neg{border-left-color:var(--red);background:var(--red-pale)}
  .devents{border-left:2px solid var(--ink);margin-left:3px;padding-left:14px;display:flex;flex-direction:column;gap:9px;
    font-size:12.5px;color:var(--ink-soft)}
  .devents .t{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase}

  /* ---------- rendered markdown ----------
     Every tag under .md is written by mdBlocks() from literals in this file; nothing here styles
     anything the author of a note could have chosen. Ink/lime/beige + JetBrains Mono only. */
  .md{overflow-wrap:break-word}
  .md>:first-child{margin-top:0}
  .md>:last-child{margin-bottom:0}
  /* pre-wrap belongs to raw source: rendered blocks carry their own spacing, and keeping it would
     add a blank line after every one of them */
  .quote.md{white-space:normal}
  .md p{margin:0 0 9px}
  .md h4.mdh{font-family:var(--mono);font-weight:700;line-height:1.35;color:var(--ink);margin:15px 0 7px}
  .md .mdh-1{font-size:14.5px}
  .md .mdh-2{font-size:13.5px}
  .md .mdh-3,.md .mdh-4{font-size:12.5px}
  .md .mdh-5,.md .mdh-6{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
  .md ul,.md ol{margin:0 0 9px;padding-left:21px}
  .md li{margin:3px 0}
  .md li::marker{font-family:var(--mono);font-weight:700;color:var(--ink-soft)}
  .md strong{font-weight:700;color:var(--ink)}
  .md em{font-style:italic}
  .md code{font-family:var(--mono);font-size:.88em;background:var(--lime);border:1px solid var(--hair);
    padding:0 4px;overflow-wrap:break-word}
  /* a fenced block scrolls in its own box: the drawer has a fixed width and a long line must never
     be the thing that widens it. min-width:0 is what allows the box to be narrower than its content. */
  .md pre{min-width:0;max-width:100%;overflow-x:auto;background:var(--ink);border:2px solid var(--ink);
    margin:0 0 10px;padding:9px 11px}
  .md pre code{display:block;background:none;border:none;padding:0;color:var(--lime);font-size:11.5px;
    line-height:1.55;white-space:pre;font-family:var(--mono)}
  /* macOS overlay scrollbars vanish, and a code block that scrolls has to say so (same call as .kanban) */
  .md pre::-webkit-scrollbar{height:9px}
  .md pre::-webkit-scrollbar-track{background:rgba(216,255,124,.16)}
  .md pre::-webkit-scrollbar-thumb{background:var(--lime)}

  /* ---------- project config panel rows ---------- */
  .crow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:8px 12px;border-bottom:1.5px solid var(--hair)}
  .crow:last-child{border-bottom:none}
  .crow .crole{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* a dropped entry must never borrow the lane-name treatment: a bare string entry would otherwise
     render as its own text and read as a real lane. It says what it is, quotes the raw value, and
     states the rule it failed on its own line rather than hiding it in a tooltip. */
  .crow.bad .lname{font-weight:500;font-style:italic;color:var(--ink-faint)}
  .crow.bad .rawv{font-family:var(--mono);font-size:11px;color:var(--ink-soft);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crow.bad .why{grid-column:1/-1;font-size:11px;color:var(--ink-faint)}
  /* one mini badge for every "state of this row" marker in the panel: slack link, agent kind */
  .badge{font-family:var(--mono);font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 5px;white-space:nowrap;
    flex:none;border:1.5px solid var(--green-deep);color:var(--green-deep);background:var(--green-pale)}
  .badge.off{border-color:var(--ink-faint);color:var(--ink-faint);background:var(--beige-2)}
  /* agent rows carry prose (brief, trigger), so they wrap onto their own full-width lines */
  .arow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 10px;align-items:center;
    padding:9px 12px;border-bottom:1.5px solid var(--hair)}
  .arow:last-child{border-bottom:none}
  /* present but unclaimed — name and prose recede, but .ameta (the NOT REGISTERED badge, already the
     faintest token here) keeps full weight: it is the one thing asking to be acted on */
  .arow.unreg>*:not(.ameta){opacity:.5}
  .ameta{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--ink-soft)}
  /* what a manager owns is a bigger fact than its kind — own row, never the tail of a flex line,
     and typed as a fact (mono, dark) so it never reads as the opening of the brief prose below it */
  /* subordinate to the agent name chip: same size, one step down in weight and colour */
  .alane{grid-column:1/-1;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft)}
  .abrief{grid-column:1/-1;font-size:12px;line-height:1.45;color:var(--ink-soft)}
  .atrig{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;line-height:1.4;color:var(--ink-faint)}
  .quote.mono{font-family:var(--mono);font-size:11.5px;line-height:1.55}
  .repolist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

  /* ---------- SHARED ----------
     the only section here with a consequence outside the tracker, so it may not borrow the panel's
     row vocabulary: .badge is the SUCCESS token (SLACK ✓) and .badge.off is the DEFICIENCY token
     (NO MANAGER). Reusing them made exposed read healthy and safe read broken. On gets the red
     tokens and its own geometry — an inverted header over a warm card; off is a plain section. */
  .dsec.expo>h3{background:var(--red);color:#fff;border:2px solid var(--ink);border-bottom:none;
    padding:6px 10px;margin-bottom:0;letter-spacing:.12em}
  .dsec.expo .expobody{border:2px solid var(--ink);background:var(--red-pale);padding:12px 12px 14px}
  .dsec.expo .expobody .mini,.dsec.expo .expobody .quote{background:#fff}
  .expolead{font-family:var(--mono);font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.07em;color:var(--red);margin-bottom:9px}
  .badge.warn{border:1.5px solid var(--ink);background:var(--red);color:#fff;letter-spacing:.1em}
  /* off is a settled fact, not a missing thing: it must not wear the NO MANAGER treatment */
  .badge.calm{border-color:rgba(28,28,28,.3);color:var(--ink-soft);background:var(--beige-2)}
  /* a withheld value is prose, not a value: it must never wear .id and read as the target itself */
  .redact{font-size:11.5px;font-style:italic;color:var(--ink-soft);min-width:0}
  /* public patterns are RULES with consequences, never names — they must not wear .chip, which the
     repo list one section down uses for 'darbar' */
  .pchip{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--beige-2);
    border:1.5px dashed rgba(28,28,28,.42);color:var(--ink-soft);padding:1px 7px;letter-spacing:.02em}
  .pchip.catchall{background:var(--red);color:#fff;border:2px solid var(--ink);border-style:solid;
    font-weight:800;font-size:12px;padding:2px 9px;letter-spacing:.06em}
  .pchip.catchall::before{content:"⚠ "}
  /* the sentence that decides whether this stays on: not a footnote, and hoisted ABOVE the row so it
     carries the offending chip with it instead of pointing at a wrapped list from underneath */
  .pathwarn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:2px solid var(--ink);
    border-left:6px solid var(--red);background:var(--red-pale);padding:9px 12px;margin:12px 0 10px}
  .pathwarn .pwtxt{flex:1;min-width:200px;font-size:12.5px;font-weight:600;color:var(--ink)}
  /* off is calm: the chip keeps the alarm, the block around it stops shouting, so the two states
     never converge on the same picture */
  .dsec:not(.expo) .pathwarn{background:var(--beige-2)}
  /* off: the URL is a preview, not a deliverable — it stops being the loudest element in the section */
  .quote.mono.prev{background:none;border:1.5px dashed var(--ink-faint);color:var(--ink-soft);
    font-weight:400;padding:9px 12px}
  .pbtn[disabled]{opacity:.5;cursor:not-allowed;border-style:dashed;background:none}
  .pbtn[disabled]:hover{border-color:rgba(28,28,28,.28);background:none}

  .empty{padding:52px 24px;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:12.5px}
  .empty b{color:var(--ink)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--lime);
    font-family:var(--mono);font-size:12px;font-weight:700;padding:11px 18px;border:2px solid var(--ink);
    box-shadow:4px 4px 0 rgba(28,28,28,.35);z-index:70;transition:transform .18s;max-width:min(560px,90vw)}
  .toast.show{transform:translate(-50%,0)}

  /* ---------- command palette ---------- */
  .pal{position:fixed;inset:0;z-index:60}
  .palscrim{position:absolute;inset:0;background:rgba(28,28,28,.55)}
  .palbox{position:relative;margin:18vh auto 0;width:min(560px,92vw);background:var(--beige);
    border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;max-height:58vh}
  .palinput{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:2px solid var(--ink);color:var(--ink-soft)}
  .palinput svg{flex:none}
  .palinput input{border:none;outline:none;background:none;width:100%;font-family:var(--mono);font-size:14px;color:var(--ink)}
  .palinput input::placeholder{color:var(--ink-faint)}
  .palresults{overflow-y:auto}
  .palgroup{font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);padding:10px 14px 4px}
  .palrow{display:flex;gap:10px;align-items:center;padding:8px 14px;cursor:pointer;border-bottom:1.5px solid var(--hair)}
  .palrow:last-child{border-bottom:none}
  .palrow:hover{background:var(--beige-2)}
  .palrow.selp{background:var(--lime);box-shadow:inset 4px 0 0 var(--ink)}
  .palrow .snippet{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13px}
  .palempty{padding:22px 14px;text-align:center;color:var(--ink-soft);font-family:var(--mono);font-size:12px}

  @media (max-width:1080px){
    .toprow{padding:0 14px;gap:10px}
    .search kbd{display:none}
    /* the people stack is the ONLY config entry, so it must survive here (FB-59/FB-64) — compact, never hidden */
    .people{padding:2px 6px}
    .people .ava{width:22px;height:22px;font-size:9px;margin-left:-6px}
    /* crumb is plain identity now: the prefix chip carries it once the name won't fit */
    .crumb #pname{display:none}
    .crumb{gap:7px}
    .drawer{inset:auto 0 0 0;top:auto;width:auto;max-height:76vh;z-index:40;border-left:none;border-top:2px solid var(--ink);
      box-shadow:0 -4px 0 var(--ink);transform:translateY(105%);transition:transform .22s ease}
    .drawer.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(28,28,28,.45);z-index:35;opacity:0;pointer-events:none;transition:.2s}
    .scrim.on{opacity:1;pointer-events:auto}
  }
  @media (min-width:1081px){ .scrim{display:none} }
</style>
</head>
<body data-view="board">
<header class="top">
  <div class="toprow">
    <!-- D tile is the home/brand mark; the wordmark is gone so the top bar names the project once -->
    <div class="brand"><span class="dot" title="Darbar">D</span></div>
    <div class="crumb"><span id="pname">…</span> <span class="chip" id="pprefix"></span>
      <button class="expomark" id="expomark" type="button" data-open-config hidden
        title="this project is configured to expose a dev server to anyone with the link · open project config">shared</button></div>
    <div class="searchwrap">
      <button class="search" id="qbtn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="ph">search tasks, feedback, ids…</span>
        <kbd>⌘K</kbd>
      </button>
    </div>
    <button class="people pbtn" id="people" data-open-config type="button" aria-pressed="false" aria-label="Open project config · humans and agents on this project" title="Project config"></button>
    <span class="live" id="livedot">live</span>
    <button class="iconbtn" id="refresh" title="Refresh" type="button"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg></button>
  </div>
  <div class="toprow toprow2">
    <nav class="views" id="views"></nav>
    <span style="flex:1"></span>
    <nav class="lanes" id="lanes"></nav>
  </div>
</header>

<main>
<div class="page">
  <div class="pagehead"><h1 id="ptitle">…</h1><span class="sub" id="psub"></span></div>
  <section class="stats" id="stats"></section>

  <section class="kanban" id="kanban" hidden></section>

  <section class="content" id="content" hidden>
    <div class="viewbar" id="viewbar"></div>
    <div class="list" id="list"></div>
  </section>
</div>
</main>
<!-- fixed full-height right panel; slides in on selection, bottom sheet under 1080px -->
<aside class="drawer" id="drawer"></aside>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>
<div class="pal" id="pal" hidden>
  <div class="palscrim" data-pal-close></div>
  <div class="palbox">
    <label class="palinput"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palq" placeholder="jump to task, feedback, project config…" autocomplete="off">
      <kbd style="font-family:var(--mono);font-size:10px;font-weight:700;background:var(--lime);border:1.5px solid var(--ink);padding:1px 6px;color:var(--ink)">ESC</kbd>
    </label>
    <div class="palresults" id="palresults"></div>
  </div>
</div>

<script>
const capId = location.pathname.split('/').pop();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// one column per status, so a column count never means anything but "cards with this status".
// backlog leads the flow and done ends it; both render folded to a rail (state.folded) — see FOLDABLE.
const KANBAN_COLS = ['backlog','todo','in_progress','in_review','qa','blocked','done'];
// a dispatch older than this with no in_progress report is a builder that probably died, not work in flight
const DISPATCH_STALE_MS = 15*60*1000;

const state = {
  data: null,
  view: 'board',           // board | list | feedback | activity | lane
  lane: null,              // active lane key when view === 'lane'
  fbFilter: 'open',        // open | all | closed
  taskFilter: 'all',       // all | active | done
  q: '',
  sel: null,               // {kind:'task'|'fb', id: shortId}
  stack: [],               // drawer back stack of sel objects
  collapsed: new Set(),    // task shortIds with hidden children
  doneExpanded: false,     // done column, when open: false = latest 5 only
  folded: new Set(['backlog','done']), // columns folded to a 44px rail; independent per column
  canWrite: null,          // null = unknown; probed once. Tunnel viewers get 403 on writes.
  pal: {open:false, q:'', sel:0},  // ⌘K palette; survives SSE re-renders
};

// tolerates a missing/non-string name: roster entries come from unvalidated project config
const initials = n => String(n ?? '').split(/[\s-]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const relTime = iso => {
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s<60) return 'just now';
  if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`;

// Task descriptions, notes, blockers, feedback bodies and resolutions are UNTRUSTED text: agents
// write them and Slack forwards them, and this board is handed to stakeholders over a capability
// URL. So the renderer has exactly one safety rule, and it is checkable by eye instead of by
// tracing data flow across functions: esc() runs ONCE, over the whole source, on the first line of

// branch can put an author's '<' into the DOM — so raw HTML in a note cannot be HTML, it can only

// sibling item), blockquotes, tables, reference links, setext headings. Images are literal too and
// that is a decision, not a gap: rendering one would make an untrusted field fetch an author-chosen
// URL from a page reached by capability link, so ![alt](url) keeps its characters — in mdText as
// well as here, which is why they share the pattern below rather than each carrying their own.

// ---- bounds ----
// Every inline pattern is bounded, and the bound IS the fix, not a length cap bolted onto the call
// site. An unbounded class like [^\]\n]+ makes every '[' in the field a start position that scans to
// the next ']' or newline, so a field with N of them costs O(N^2): measured 10k 72ms, 20k 219ms,
// 40k 789ms, 80k 3106ms, and mdText the same, which is a hung tab once mdText runs per feedback row
// on every palette keystroke and every open tab re-renders on an SSE tick. Bounded, one candidate
// costs at most the bound, so a field costs O(length). A span longer than its bound is simply not
// that construct and stays literal text, like every other near-miss here. The numbers are far above
// anything these fields hold (the longest inline code on the board today is around 30 characters).
const MD_MAX = { code: 400, text: 200, url: 500, emph: 300 };

const MD_CODE_SRC = `\`([^\`\\n]{1,${MD_MAX.code}})\``;

// scheme (java&#115;cript:) has already become the literal text java&amp;#115;cript: and has no
// colon left to be a scheme with. A url that fails keeps its source characters instead of becoming
// an <a> with a stripped href.
// The relative branch rejects a following slash OR BACKSLASH: browsers read /\evil.com and //evil.com
// the same way and both leave the origin, so a root-relative-looking link could resolve offsite. It
// buys deception rather than a boundary break (https://anything is allowed here), which is exactly
// why it has to be closed at the pattern instead of argued about.

  // answer ("the link does not resolve") sits over a route that was never actually withdrawn.
  const badge = on
    ? `<span class="badge warn" title="project config: proxy.enabled is true · this is what the board asked the proxy to serve, not a reading of the route table">ENABLED</span>`
    : `<span class="badge calm" title="project config: proxy.enabled is false · the board asked for no route; it cannot confirm the proxy dropped one it published earlier">DISABLED</span>`;
  const rows = `<div class="mini">
      <div class="crow"><span class="lname">${on?'configured to serve this app to anyone with the link'
        :stray?'configured off · the route this project published was never withdrawn':'configured off · nothing is meant to be handed out'}</span>
        <span class="id"></span>${badge}</div>
      <div class="crow"><span class="lname">prefix</span><span class="id">${esc(prefix||'—')}</span></div>
      <div class="crow"><span class="lname">target</span>${targetCell}</div>
    </div>`;
  // Three states, three pictures (FB-104). Live and yours to share: full weight, "copy link".
  // Live and NOT yours to share (stray): still full weight, because that link is the live thing being
  // served right now — the demotion below would render the alarm as hypothetical directly under a red
  // header that says it is not. The copy stays armed under an honest label: the obvious next move is
  // to paste it and find out whether it still resolves, and the judgement about not handing it out
  // already reads better in the note above than a dead button states it.
  // Not live at all: demoted box, genuinely disabled control — that link 404s and copying it costs.
  const link = !url ? '' : on
    ? `<div class="note">stakeholder link · this is the thing you hand over</div>
      <div class="quote mono">${esc(url)}</div>
      <button class="pbtn" type="button" data-copy="${esc(url)}" style="margin-top:8px">copy link</button>`
    : stray
    ? `<div class="note">this link may still resolve · the published route has not been withdrawn, but sharing is configured off, so it is not yours to hand out</div>
      <div class="quote mono">${esc(url)}</div>
      <button class="pbtn" type="button" data-copy="${esc(url)}" style="margin-top:8px"
        title="this is a live route, not a preview · copy it to check whether it still resolves">copy · to check whether this still resolves</button>`
    : `<div class="note">preview of the link this config would publish · nothing to hand over while sharing is off</div>
      <div class="quote mono prev">${esc(url)}</div>
      <button class="pbtn" type="button" disabled style="margin-top:8px"
        title="sharing is configured off · turn it on before handing this link to anyone">copy · sharing is off</button>`;
  const paths = !pats.length
    ? `<div class="note">public paths · none listed · nothing would be reachable through the tunnel${on?', even though this is enabled':''}</div>`
    : `${wild.length?`<div class="pathwarn">${wild.map(s=>`<span class="pchip catchall">${esc(s)}</span>`).join('')}
        <span class="pwtxt">matches every path · the whole app is served${alarm?'':' the moment this is enabled'}, not only the paths listed below</span></div>`:''}
      <div class="note">public paths · ${on?'only requests matching these are served through the tunnel; local access is never filtered'
        :stray?'the route that is still published serves requests matching these; local access is never filtered'
        :'these are the paths this config would serve once it is enabled'}</div>
      <div class="repolist">${pats.map(s=>`<span class="pchip${isCatchAll(s)?' catchall':''}" title="${esc(patTitle(s))}">${esc(s)}</span>`).join('')}</div>
      <div class="note">${PAT_FORM}</div>`;
  // the rows above state INTENT. This is the only line allowed to speak about the route table, and
  // only from what the server reports it published — never inferred from proxy.enabled.
  const caveat = `<div class="note">${
    holds === null ? (on
      ? 'this is the project config, not a reading of the proxy · if the last route sync failed, what is being served may differ'
      : 'this is the project config, not a reading of the proxy · a withdrawal that failed to sync can leave an earlier route live')
    : holds === true ? (on
      ? 'the server reports it published this route and has not withdrawn it'
      : 'the server still reports this route as published · the withdrawal has not landed, so treat the link as live until it does')
    : (on
      ? 'the server does not report a published route for this prefix · the publish may not have landed yet'
      : 'the server reports no published route for this prefix')}</div>`;
  // an orphan is a live route this config does not describe at all, so it gets its own block rather
  // than being folded into rows that are about the current prefix (FB-102 case 3: already-red still
  // has to say that a SECOND route is open)
  const strayBlock = !orphans.length ? '' :
    `<div class="expolead" style="margin-top:14px">also still live · not described by this config</div>${orphanBlock(p, orphans)}`;
  const head = on ? 'configured on' : stray ? 'configured off · route still live'
    : orphans.length ? 'configured off · another route still live' : 'configured off';
  const lead = on ? 'exposed by configuration · anyone with the link' : 'exposed despite being off · anyone with the link';
  if (alarm) return `<div class="dsec expo"><h3>Shared · ${head}</h3>
    <div class="expobody">
      <div class="expolead">${lead}</div>
      ${rows}${link}${paths}${caveat}${strayBlock}
    </div></div>`;
  return `<div class="dsec"><h3>Shared · configured off</h3>${rows}${link}${paths}${caveat}</div>`;
}
function plannedLanesSec(t){
  const reviews = pipeLanes();
  // a closed task has no future to describe: every branch states what did or did not happen, never
  // what will. A cancelled task will never move to in review, so "these lanes open when it does" is
  // simply false there.
  const closed = isClosed(t);
  // default-all (lanes null/absent) is the state of most tasks, so silence here would leave the
  // drawer saying nothing about a plan that will in fact spawn every lane. Stated, but as an
  // inherited default rather than as a selection someone made.
  if (!Array.isArray(t.lanes)){
    if (!reviews.length) return ''; // no pipeline: there is genuinely no plan to state
    // closed: no rows. These rows are the PROJECT's pipeline as it stands today, not this task's —
    // on an open task the default makes them this task's plan, on a closed one they are a review
    // that never ran, drawn at full strength above a soft correction. State the fact, stop
    // illustrating it — the same header+note shape lanes:[] already uses one branch away.
    // "all 1" is not a count anyone says out loud
    return `<div class="dsec"><h3>Review lanes · ${closed?'none recorded':reviews.length===1?'1':`all ${reviews.length}`}</h3>
      ${closed?'':`<div class="mini dflt">${reviews.map(l=>laneRow(l.lane, l)).join('')}</div>`}
      <div class="note">${closed?'closed with no lanes recorded · no review ran on this task':'default · every configured lane runs · no per-task selection recorded'}</div></div>`;
  }
  if (!t.lanes.length) return `<div class="dsec"><h3>Review lanes · none</h3>
    <div class="note">${closed?'deliberately skipped · no lanes ever spawned':'deliberately skipped · no lanes will spawn'}</div></div>`;
  // the explicit array IS a fact about this task — its own recorded selection — so the rows stay
  // on a closed task; only the tense changes.
  return `<div class="dsec"><h3>Review lanes · ${t.lanes.length} ${closed?'never spawned':'planned'}</h3>
    <div class="mini">${t.lanes.map(k=>laneRow(k, reviews.find(x=>x.lane===k))).join('')}</div>
    <div class="note">${closed?'planned, never spawned · no review ran on this task':'planned, not spawned · these lanes open when this task moves to in review'}</div></div>`;
}

// prose preview: first paragraph, cut on a word boundary. The ellipsis is derived from what
// was actually dropped, so text that fits exactly never loses a character to the marker.
// Shared by the charter block and the agent briefs — one truncator, two caps.
const CHARTER_CAP = 400, BRIEF_CAP = 165;
// a sentence ends on a terminator followed by the end of the text or a new opening capital —
// "e.g. foo" style dots stay inside the sentence. The length floor is what kills the openers the
// lookahead cannot ("e.g. Lint", "Dr. Smith", "1. Do this"): no real brief opens on a 25-char sentence.
const SENTENCE_FLOOR = 25;
const FIRST_SENTENCE = new RegExp(`^[\\s\\S]{${SENTENCE_FLOOR - 1},}?[.!?](?=$|\\s+["'(\\[]?[A-Z])`);
function textPreview(src, cap = CHARTER_CAP, sentence = false){
  const full = String(src||'').trim();
  const para = full.split(/\n\s*\n/)[0].trim();
  let text = para, clipped = para.length < full.length;
  // briefs open with a complete role statement — one sentence is the whole point they make
  const s = sentence ? para.match(FIRST_SENTENCE)?.[0] : null;
  if (s && s.length <= cap){
    text = s; clipped = s.length < full.length;
  }
  else if (para.length > cap){
    const cut = para.slice(0, cap);
    const sp = cut.lastIndexOf(' ');
    text = (sp > 0 ? cut.slice(0, sp) : cut).replace(/[\s,;:.–—-]+$/,'');
    clipped = true;
  }
  // marker sits off a finished sentence, tight against a cut word
  return {text, clipped, marker: clipped ? (/[.!?)]$/.test(text) ? ' …' : '…') : ''};
}

// ---------- rendering ----------
function render(){
  const d = state.data; if(!d) return;
  document.title = `${d.project.name} · Darbar`;
  $('pname').textContent = d.project.name;
  $('pprefix').textContent = d.project.prefix;
  $('ptitle').textContent = d.project.name;
  $('psub').textContent = (d.project.repos||[]).join(' · ');
  // exposure is stated on the board surface, not only inside a panel you have to already suspect
  // "still live" covers both fail-open shapes: this config's own route never withdrawn, and any
  // published route the config does not account for at all (a rename orphan, or a cleared config)
  const em = $('expomark'), strayed = proxyStrayed(d.project) || proxyOrphans(d.project).length > 0;
  em.hidden = !boardExposed(d.project);
  em.textContent = strayed ? 'still live' : 'shared';
  em.title = strayed
    ? 'the server reports a published route this project is not asking for · open project config'
    : 'this project is configured to expose a dev server to anyone with the link · open project config';

  renderTopNav(); renderPeople(); renderStats(); renderContent(); renderDrawer(); renderPal();
}

// agents never mix with stakeholders. project.agents is the registry and the source of truth,
// so a helper that has never touched a task still shows. Anything working on the board but
// missing from the registry is kept as registered:false rather than dropped — nothing hides.
// One roster feeds both the top-bar stack and the panel, so the two can never disagree.
function agentRoster(){
  // one manager can own several lanes — collect every label, don't let the last one win
  const laneOf = new Map();
  // pipeLanes(), not the raw read: ?? only defends against null/undefined, so a non-array reviews
  // (7, true, {…}) threw "not iterable" out of render() and the board never painted at all
  for (const l of pipeLanes()){
    if (!l.manager || !l.label) continue;
    if (!laneOf.has(l.manager)) laneOf.set(l.manager, []);
    laneOf.get(l.manager).push(l.label);
  }
  const out = [], seen = new Set();
  const lanesOf = n => laneOf.get(n) ?? [];
  const laneLabel = ls => ls.join(' + ');
  for (const a of state.data?.project?.agents ?? []){
    if (!a?.name || seen.has(a.name)) continue;
    seen.add(a.name);
    const kind = a.kind || 'agent', ls = lanesOf(a.name);
    out.push({name:a.name, kind, brief:a.brief||'', trigger:a.trigger||'', lane:laneLabel(ls), laneCount:ls.length, registered:true,
      role: ls.length ? `${kind} · runs ${laneLabel(ls)} lane${ls.length>1?'s':''}` : kind});
  }
  // observed-but-unregistered: a pipeline lane manager or a task assignee the registry never declared
  const observe = name => { if (!name || seen.has(name)) return; seen.add(name);
    const ls = lanesOf(name);
    out.push({name, kind:'', brief:'', trigger:'', lane:laneLabel(ls), laneCount:ls.length, registered:false,
      role:'not in the registry · seen on this project'}); };
  for (const m of laneOf.keys()) observe(m);
  for (const t of tasks()) if (t.assigneeType==='agent' && t.assignee) observe(t.assignee);
  return out;
}

// one row shape for both groups — the unregistered ones only recede and swap the badge, so the
// difference reads as provenance rather than as two unrelated widgets
function agentRow(a){
  const bp = a.brief ? textPreview(a.brief, BRIEF_CAP, true) : null;
  // lane first: it is the only varying token, so it must not sit between two fixed words
  const lane = a.lane ? `${a.lane} lane${a.laneCount>1?'s':''}` : '';
  return `<div class="arow${a.registered?'':' unreg'}">
    <span class="who agent"><span class="a">${esc(initials(a.name))}</span>${esc(a.name)}</span>
    <span class="ameta">${a.registered
      ? `<span class="badge" title="registry kind">${esc(a.kind)}</span>`
      : '<span class="badge off" title="works here but project.agents never declared it">NOT REGISTERED</span>'}</span>
    ${lane?`<span class="alane" title="runs the ${esc(lane)}">${esc(lane)}</span>`:''}
    ${bp?`<span class="abrief" title="${esc(a.brief)}">${esc(bp.text)}${bp.marker}</span>`:''}
    ${a.trigger?`<span class="atrig">on: ${esc(a.trigger)}</span>`:''}
  </div>`;
}

const PPL_CAP = 4; // a growing registry must never push into the search bar
// one overlapping stack, capped per species; the shape (round vs square) makes the
// human/agent split pre-attentive without spending a label or a divider on it
function pplChips(cls, list, note){
  if (!list.length) return [];
  const shown = list.slice(0, PPL_CAP), rest = list.slice(PPL_CAP);
  const out = shown.map(x=>({cls:`ava ${cls}`, text:initials(x.name), title:`${x.name} · ${x.role||note}`}));
  if (rest.length) out.push({cls:'pmore', text:`+${rest.length}`, title:rest.map(x=>x.name).join(', ')});
  return out;
}

// stats are board furniture: the other views want that vertical space for their own rows.
// Gated on state.view so an SSE re-render can never flash them back onto List/Feedback/Activity/Lane.
function renderStats(){
  const el = $('stats');
  if (state.view !== 'board'){ el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  // "completed" is a ratio of the work that has a card on this board: backlog rows are candidates,
  // not promises, and cancelled rows are work nobody will ever do, so neither belongs in a denominator

  const ts = tasks().filter(t=>t.type!=='review' && t.status!=='backlog' && t.status!=='cancelled');

  const uncounted = [backlog?`${backlog} in backlog`:'', cancelled?`${cancelled} cancelled`:''].filter(Boolean).join(', ');

      <div class="progress"><i style="width:${ts.length?Math.round(done/ts.length*100):0}%"></i></div>

    <div class="stat"><div class="lbl">Feedback · needs triage</div><div class="val">${pend}</div>
      <div class="hint">${pend? `awaiting triage · ${open} open total` : open? `<b>triage clear</b> · ${open} open total` : '<b>clear</b>, nothing waiting'}</div></div>
    <div class="stat"><div class="lbl">Reviews in flight</div><div class="val">${openRev}<span class="of">${reviews.length?` / ${reviews.length}`:''}</span></div>
      <div class="hint">${pipeLanes().length ? (openRev ? 'lanes working' : '<b>clear</b>, no open lanes')
        : pipeBadLanes().length ? 'pipeline configured but unroutable' : 'no pipeline configured'}</div></div>
    <div class="stat"><div class="lbl">Activity · 7 days</div>
      <div class="spark">${per.map((n,i)=>`<i class="${i===6?'hot':''}" style="height:${Math.max(12,n/mx*100)}%" title="${days[i].slice(0,10)}: ${n} events"></i>`).join('')}</div>
      <div class="hint">${per[6]} today · ${humans.size} human${humans.size===1?'':'s'}, ${agents.size} agent${agents.size===1?'':'s'} active</div></div>`;

const matches = (txt) => !state.q || txt.toLowerCase().includes(state.q);

// ---------- dispatched (handed out, not yet self-reported) ----------
// The orchestrator knows a task was dispatched; only the agent knows it started. So the board says
// exactly that, and never upgrades a dispatch into "in progress" on the agent's behalf. The stamp is
// only meaningful while the row still reads as unstarted; any status change clears it server-side.
const dispatchPending = t => !!t.dispatchedAt && (t.status==='todo' || t.status==='backlog');
const dispatchLate = t => dispatchPending(t) && Date.now() - new Date(t.dispatchedAt).getTime() > DISPATCH_STALE_MS;
// compact age for the badge; the full "x ago" wording stays in the tooltip
const ageShort = iso => {
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s<60) return '<1m';
  if (s<3600) return `${Math.floor(s/60)}m`;
  if (s<86400) return `${Math.floor(s/3600)}h`;
  return `${Math.floor(s/86400)}d`;
};
// folded backlog rail: it can only speak for the group, so it says how many and whether the oldest
// of them is already overdue
const railWhy = (n, late) => `${n} dispatched in the backlog${late?', the oldest with no in_progress report yet':''} · open it to see which`;
const dispWhy = (iso, late) => late
  ? `dispatched ${relTime(iso)} and still no in_progress report. The builder may have died: re-dispatch it or mark it blocked`
  : `dispatched ${relTime(iso)}, waiting for the builder to report in_progress itself`;
// data-disp-badge carries the stamp so the age can be re-cut in place by the tick below, in whatever
// view this badge was rendered into.
function dispatchBadge(t){
  if (!dispatchPending(t)) return '';
  const late = dispatchLate(t);
  return `<span class="disp ${late?'stale':''}" data-disp-badge="${esc(t.dispatchedAt)}" title="${esc(dispWhy(t.dispatchedAt, late))}">DISPATCHED ${esc(ageShort(t.dispatchedAt))}</span>`;
}

// A dispatch badge is only honest because it ages, and the board otherwise repaints only when
// something happens. A dispatch that nobody picks up produces no events at all, which is exactly the
// case that must go stale on screen. Re-cutting the stamps in place (rather than re-rendering one
// view) covers every surface that shows one — board cards, List and lane rows, the folded backlog
// rail, the drawer — and touches no scroll position, no open drawer and no drag in flight.
function tickDispatchAges(){
  const now = Date.now();
  const isLate = iso => now - new Date(iso).getTime() > DISPATCH_STALE_MS;
  for (const el of document.querySelectorAll('[data-disp-badge]')){
    const iso = el.dataset.dispBadge, late = isLate(iso);
    el.textContent = `DISPATCHED ${ageShort(iso)}`;
    el.classList.toggle('stale', late);
    el.title = dispWhy(iso, late);
  }
  // drawer row: full "x ago" wording, and it says out loud when the report is overdue
  for (const el of document.querySelectorAll('[data-disp-rel]')){
    const iso = el.dataset.dispRel;
    el.textContent = relTime(iso) + (isLate(iso) ? ' · no in_progress report yet' : '');
  }
  // the card's edge stripe and the folded rail's pill turn red on the same clock
  for (const el of document.querySelectorAll('[data-disp-card]')) el.classList.toggle('late', isLate(el.dataset.dispCard));
  for (const el of document.querySelectorAll('[data-disp-rail]')){
    const late = isLate(el.dataset.dispRail);

// The two ends of the flow fold to a rail: backlog is work nobody has committed to yet, done is work
// nobody has to look at again (MRF carries 368 done cards). Both start folded so the committed middle
// owns the width, and each remembers its own state — opening Done to find a card must not drag the
// backlog open with it. ONE rail implementation for both: a second copy of this affordance is how two
// versions of it drift apart.
const FOLDABLE = ['backlog','done'];
const isFolded = col => state.folded.has(col);
// what the rail says the column is, since a count alone cannot say why it is folded
const FOLD_WHY = {backlog:'not committed work', done:'finished work, kept for the record'};

// 238px is the width a column wants; it is not worth pushing Done off the right edge to keep it.
// Unfolding a rail adds a full column, which no laptop window fits at 238 once both are open, so the
// columns narrow to whatever the window actually has, down to a floor where a card still reads. Past
// the floor the board scrolls, and .kanban's own scrollbar is drawn in so that reads as scrollable.
const COL_WANT = 238, COL_FLOOR = 200, COL_GAP = 14, RAIL_W = 44;
function colMin(el, flexCols, rails){
  const box = el.clientWidth; // horizontal overflow does not change this, so it is safe to re-measure
  if (!box) return COL_WANT;
  const avail = box - RAIL_W*rails - COL_GAP*(flexCols + rails - 1);
  return Math.max(COL_FLOOR, Math.min(COL_WANT, Math.floor(avail/flexCols)));
}

// a folded column: its own 44px of width, the count, and still a live drop target so a card can be
// dropped straight onto it. A dispatch outstanding inside one is the only thing that cannot wait for
// someone to unfold, so it gets its own pill on the same 15-minute clock as the badges it stands in
// for (only backlog can hold one — dispatchPending is gated to todo/backlog — so the generic code
// simply renders nothing for done).
function railCol(col, cards){
  const disp = cards.filter(dispatchPending);
  const oldest = disp.map(t=>t.dispatchedAt).sort()[0]; // if any is overdue, this one is
  const dispPill = disp.length ? `<span class="disp rail ${disp.some(dispatchLate)?'stale':''}"
    data-disp-rail="${esc(oldest)}" data-disp-n="${disp.length}"
    title="${esc(railWhy(disp.length, disp.some(dispatchLate)))}">${disp.length} DISPATCHED</span>` : '';
  return `<div class="kcol fold ${cards.length?'':'slim'}" data-col="${col}">
    <button class="foldbtn" data-fold="${col}" title="${cards.length} ${nice(col)} · ${FOLD_WHY[col]}. click to open">
      <span class="n">${cards.length}</span>${dispPill}<span class="fl">${nice(col)}</span></button>
    <div class="kcards" data-col="${col}" hidden></div></div>`;
}

function renderKanban(){
  const visible = tasks().filter(t=>t.type!=='review' && t.status!=='cancelled' && matches(t.title+' '+t.shortId+' '+(t.assignee||'')));
  const k = $('kanban');
  // a folded column gets its own width, not a share of the board's
  const rails = KANBAN_COLS.filter(isFolded).length;
  const min = colMin(k, KANBAN_COLS.length - rails, rails);
  k.style.gridTemplateColumns = KANBAN_COLS
    .map(col => isFolded(col) ? 'auto' : `minmax(${min}px,1fr)`).join(' ');
  k.innerHTML = KANBAN_COLS.map(col=>{
    const cards = visible.filter(t=>t.status===col);
    if (isFolded(col)) return railCol(col, cards);
    let shown = cards, toggle = '';
    if (col==='done'){
      shown = [...cards].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
      if (cards.length>5){
        toggle = `<button class="kmore" data-done-toggle>${state.doneExpanded?'show latest 5':`show all ${cards.length}`}</button>`;
        if (!state.doneExpanded) shown = shown.slice(0,5);
      }
    }
    return `<div class="kcol ${cards.length?'':'slim'}" data-col="${col}">
      <div class="khead">${nice(col)}<span class="n">${cards.length}</span>${
        FOLDABLE.includes(col)?`<button class="foldx" data-fold="${col}" title="fold ${nice(col)} back to a rail">FOLD</button>`:''}</div>
      <div class="kcards" data-col="${col}">${shown.map(cardHtml).join('') || `<div class="kempty">—</div>`}</div>
      ${toggle}</div>`;
  }).join('');
}

    el.innerHTML = list.map(f=>{
      const sel = state.sel?.kind==='fb' && state.sel.id===f.shortId;
      return `<div class="frow ${sel?'sel':''}" data-fb="${esc(f.shortId)}">
        <span class="id">${esc(f.shortId)}</span>
        <span class="col"><div class="fbody">${mdText(f.body)||'<i style="color:var(--ink-faint)">screenshot only</i>'}</div>
          <div class="fsub"><span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span>
            <span class="typ typ-${esc(f.type)}">${esc(f.type)}</span>
            ${f.taskShortId?`<span class="id">on ${esc(f.taskShortId)}</span>`:'<span class="id">project-level</span>'}
            ${f.attachments?.length?`<span class="id">[${f.attachments.length} img]</span>`:''}</div></span>

      </div>`;}).join('') || `<div class="empty">${state.fbFilter==='open'?'inbox clear, nothing open':'no feedback here yet'}</div>`;
  }
  else {
    vb.innerHTML = `<span class="vtitle">Activity</span>`;
    const evs = (state.data?.events||[]).filter(e=>matches(e.text));
    const groups = {};
    for (const e of evs){
      const d = new Date(e.at); const today = new Date();

      }).join('')).join('') || '<div class="empty">quiet so far</div>';
  }
