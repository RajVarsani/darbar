<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mission Control</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --line:#e8eaef; --line-soft:#f0f2f5;
    --ink:#181b21; --muted:#697180; --faint:#9aa2b1;
    --accent:#2f6bff; --accent-soft:#eaf0ff;
    --green:#178f57; --green-soft:#e5f5ec;
    --amber:#a06c08; --amber-soft:#fdf2dd;
    --red:#d0453f; --red-soft:#fdecea;
    --violet:#6d51e8; --violet-soft:#efecfd;
    --teal:#0e8a86; --teal-soft:#e2f4f3;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --shadow:0 1px 2px rgba(23,27,33,.04),0 4px 16px rgba(23,27,33,.05);
    --r:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent-soft)}

  /* ---------- top bar ---------- */
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
    padding:0 24px;height:60px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#7aa0ff);
    display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
  .crumb{color:var(--faint);font-weight:400}
  .chip{font-family:var(--mono);font-size:11px;background:var(--line-soft);border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;color:var(--muted)}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);font-weight:550}
  .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2.2s infinite}
  .live.off{color:var(--faint)} .live.off::before{background:var(--faint);animation:none}
  @keyframes pulse{50%{opacity:.25}}
  .searchwrap{flex:1;display:flex;justify-content:center}
  .search{display:flex;align-items:center;gap:8px;width:min(420px,100%);background:var(--line-soft);
    border:1px solid transparent;border-radius:10px;padding:7px 12px;color:var(--faint);transition:.15s}
  .search:focus-within{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search svg{flex:none}
  .search input{border:none;outline:none;background:none;width:100%;font:inherit;color:var(--ink)}
  .search kbd{font-family:var(--mono);font-size:10.5px;background:#fff;border:1px solid var(--line);
    border-radius:5px;padding:1px 6px;color:var(--faint)}
  .people{display:flex;align-items:center}
  .ava{width:28px;height:28px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;
    font-size:10.5px;font-weight:650;color:#fff;margin-left:-6px}
  .ava:first-child{margin-left:0}

  /* ---------- page ---------- */
  .page{max-width:1440px;margin:0 auto;padding:24px 24px 60px}
  h1{font-size:22px;font-weight:650;letter-spacing:-.02em}
  .pagehead{display:flex;align-items:baseline;gap:12px;margin:6px 0 20px;flex-wrap:wrap}
  .pagehead .sub{color:var(--muted);font-size:13px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:12.5px;color:var(--muted);font-weight:550}
  .stat .val{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0 1px}
  .stat .hint{font-size:12px;color:var(--faint)}
  .stat .hint b{color:var(--green);font-weight:600}
  .progress{height:5px;border-radius:99px;background:var(--line-soft);margin-top:10px;overflow:hidden}
  .progress i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .5s ease}
  .spark{display:flex;align-items:flex-end;gap:4px;height:34px;margin-top:8px}
  .spark i{flex:1;border-radius:4px 4px 2px 2px;background:var(--accent-soft);min-height:3px;transition:height .4s ease}
  .spark i.hot{background:var(--accent)}

  /* ---------- split ---------- */
  .split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
  .content{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}

  .tabs{display:flex;align-items:center;gap:2px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .tab{padding:7px 14px;border-radius:8px;font-weight:550;font-size:13.5px;color:var(--muted);transition:.13s}
  .tab:hover{background:var(--line-soft)}
  .tab.on{background:var(--accent-soft);color:var(--accent)}
  .tab .n{font-size:11px;font-family:var(--mono);background:#fff;border:1px solid var(--line);border-radius:5px;
    padding:0 5px;margin-left:6px;color:var(--faint)}
  .filters{margin-left:auto;display:flex;gap:2px;background:var(--line-soft);border-radius:8px;padding:3px}
  .seg{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--muted);font-weight:550}
  .seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.07)}

  /* ---------- rows ---------- */
  .list{min-height:340px}
  .trow{display:grid;grid-template-columns:26px 74px minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:11px 16px 11px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .1s}
  .trow:hover{background:#fafbfc}
  .trow.sel{background:var(--accent-soft)}
  .trow:last-child{border-bottom:none}
  .trow.sub .id::before{content:"└";color:var(--faint);margin-right:5px}
  .trow.sub{grid-template-columns:26px 90px minmax(0,1fr) auto}
  .caret{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--faint);transition:.12s}
  .caret:hover{background:var(--line-soft);color:var(--ink)}
  .caret svg{transition:transform .15s}
  .caret.openc svg{transform:rotate(90deg)}
  .id{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .ttl{font-weight:530;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rmeta{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
  .fbn{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
  .fbn.warn{color:var(--amber);font-weight:600}

  .frow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;align-items:start;
    padding:12px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background .1s}
  .frow:hover{background:#fafbfc}
  .frow.sel{background:var(--accent-soft)}
  .frow:last-child{border-bottom:none}
  .fbody{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fsub{display:flex;gap:8px;align-items:center;margin-top:3px;font-size:12px;color:var(--faint);flex-wrap:wrap}
  .frow .col{min-width:0}
  .time{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

  /* pills + chips */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;
    padding:2.5px 10px;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .st-todo,.st-backlog{background:var(--line-soft);color:var(--muted)}
  .st-in_progress,.st-triaged,.st-accepted{background:var(--accent-soft);color:var(--accent)}
  .st-qa,.st-review{background:var(--violet-soft);color:var(--violet)}
  .st-blocked{background:var(--red-soft);color:var(--red)}
  .st-done,.st-resolved{background:var(--green-soft);color:var(--green)}
  .st-pending,.st-needs_clarification{background:var(--amber-soft);color:var(--amber)}
  .st-rejected{background:var(--line-soft);color:var(--faint)}
  .who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px 2px 3px}
  .who .a{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700}
  .who.human{background:var(--amber-soft);color:var(--amber)} .who.human .a{background:var(--amber)}
  .who.agent{background:var(--teal-soft);color:var(--teal)} .who.agent .a{background:var(--teal)}
  .typ{font-size:11px;font-weight:650;letter-spacing:.02em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
  .typ-bug{background:var(--red-soft);color:var(--red)}
  .typ-design{background:var(--violet-soft);color:var(--violet)}
  .typ-idea{background:var(--accent-soft);color:var(--accent)}
  .typ-approval{background:var(--green-soft);color:var(--green)}

  /* ---------- activity ---------- */
  .evgroup{padding:14px 18px 4px;color:var(--faint);font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
  .ev{display:grid;grid-template-columns:64px 12px minmax(0,1fr);gap:10px;padding:7px 18px;align-items:center}
  .ev .t{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
  .ev .b{position:relative;height:100%} .ev .b::before{content:"";position:absolute;left:3px;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;background:var(--line);border:1.5px solid var(--faint)}
  .ev .x{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .x b{color:var(--ink);font-weight:600;font-family:var(--mono);font-size:12px}

  /* ---------- drawer ---------- */
  .drawer{position:sticky;top:78px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--shadow);max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
  .dhead{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .dhead .grow{flex:1}
  .iconbtn{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:.12s}
  .iconbtn:hover{background:var(--line-soft);color:var(--ink)}
  .iconbtn[disabled]{opacity:.35;pointer-events:none}
  .dbody{overflow-y:auto;padding:18px 20px 24px}
  .dempty{display:grid;place-items:center;text-align:center;padding:60px 24px;color:var(--faint)}
  .dempty .big{width:44px;height:44px;border-radius:12px;background:var(--line-soft);display:grid;place-items:center;margin:0 auto 12px}
  .dtitle{font-size:16.5px;font-weight:650;letter-spacing:-.01em;margin:8px 0 2px;text-wrap:balance}
  .dgrid{display:grid;grid-template-columns:110px 1fr;row-gap:8px;column-gap:12px;margin:14px 0;font-size:13px}
  .dgrid .k{color:var(--faint)}
  .dsec{margin-top:20px}
  .dsec>h3{font-size:11.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .mini{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .mini .trow,.mini .frow{padding-left:12px}
  .quote{background:var(--line-soft);border-radius:10px;padding:12px 14px;color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .shots a img{width:96px;height:68px;object-fit:cover;border-radius:8px;border:1px solid var(--line);transition:.15s}
  .shots a:hover img{transform:scale(1.03);box-shadow:var(--shadow)}
  .commits{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
  .taskcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:.12s;display:flex;gap:10px;align-items:center}
  .taskcard:hover{border-color:var(--accent);background:var(--accent-soft)}
  .flow{display:flex;align-items:center;gap:0;margin-top:6px;flex-wrap:wrap;row-gap:8px}
  .step{font-size:11px;font-weight:600;color:var(--faint);background:var(--line-soft);border-radius:99px;padding:3px 10px}
  .step.hit{background:var(--green-soft);color:var(--green)}
  .step.now{background:var(--amber-soft);color:var(--amber)}
  .step.bad{background:var(--red-soft);color:var(--red)}
  .arrow{color:var(--line);margin:0 4px;font-size:11px}
  .note{font-size:12px;color:var(--faint);margin-top:8px}
  .resol{border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;padding:10px 14px;color:var(--ink)}
  .resol.neg{border-color:var(--red);background:var(--red-soft)}
  .devents{border-left:1.5px solid var(--line);margin-left:4px;padding-left:14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted)}
  .devents .t{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

  .empty{padding:52px 24px;text-align:center;color:var(--faint)}
  .empty b{color:var(--muted)}

  @media (max-width:1080px){
    .split{grid-template-columns:1fr}
    .drawer{position:fixed;inset:auto 0 0 0;top:auto;max-height:76vh;border-radius:16px 16px 0 0;z-index:40;
      transform:translateY(105%);transition:transform .25s ease}
    .drawer.open{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(23,27,33,.35);z-index:35;opacity:0;pointer-events:none;transition:.2s}
    .scrim.on{opacity:1;pointer-events:auto}
  }
  @media (min-width:1081px){ .scrim{display:none} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot">M</span>Mission Control <span class="crumb">/</span>
    <span id="pname">…</span> <span class="chip" id="pprefix"></span> <span class="live" id="livedot">live</span>
  </div>
  <div class="searchwrap">
    <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search tasks, feedback, ids…" autocomplete="off">
      <kbd>⌘K</kbd>
    </label>
  </div>
  <div class="people" id="people"></div>
</header>

<div class="page">
  <div class="pagehead"><h1 id="ptitle">…</h1><span class="sub" id="psub"></span></div>
  <section class="stats" id="stats"></section>
  <div class="split">
    <section class="content">
      <nav class="tabs" id="tabs"></nav>
      <div class="list" id="list"></div>
    </section>
    <aside class="drawer" id="drawer"></aside>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script>
const capId = location.pathname.split('/').pop();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const state = {
  data: null,
  tab: 'tasks',            // tasks | feedback | activity
  fbFilter: 'open',        // open | all | closed
  taskFilter: 'all',       // all | active | done
  q: '',
  sel: null,               // {kind:'task'|'fb', id: shortId}
  stack: [],               // drawer back stack of sel objects
  collapsed: new Set(),    // task shortIds with hidden children
};

const AVA_COLORS = ['#2f6bff','#6d51e8','#0e8a86','#a06c08','#d0453f','#178f57'];
const initials = n => n.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const relTime = iso => {
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if (s<60) return 'just now';
  if (s<3600) return `${Math.floor(s/60)}m ago`;
  if (s<86400) return `${Math.floor(s/3600)}h ago`;
  if (s<86400*7) return `${Math.floor(s/86400)}d ago`;
  return new Date(iso).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
};
const nice = s => String(s||'').replace(/_/g,' ');

// ---------- data helpers ----------
const tasks = () => state.data?.tasks ?? [];
const fbs = () => state.data?.feedback ?? [];
const byShort = id => tasks().find(t=>t.shortId===id);
const fbByShort = id => fbs().find(f=>f.shortId===id);
const childrenOf = t => tasks().filter(x=>x.parentTaskId===t._id);
const fbForTask = t => fbs().filter(f=>f.taskId===t._id);
const openFb = f => !['resolved','rejected'].includes(f.status);
const eventsForTask = t => (state.data?.events??[]).filter(e=>e.taskId===t._id || (e.text||'').includes(t.shortId));

// ---------- rendering ----------
function render(){
  const d = state.data; if(!d) return;
  document.title = `${d.project.name} · Mission Control`;
  $('pname').textContent = d.project.name;
  $('pprefix').textContent = d.project.prefix;
  $('ptitle').textContent = d.project.name;
  $('psub').textContent = (d.project.repos||[]).join(' · ');
  renderPeople(); renderStats(); renderTabs(); renderList(); renderDrawer();
}

function renderPeople(){
  const ppl = state.data.project.stakeholders||[];
  const agents = [...new Set(tasks().filter(t=>t.assigneeType==='agent'&&t.assignee).map(t=>t.assignee))];
  $('people').innerHTML = ppl.map((p,i)=>
    `<span class="ava" title="${esc(p.name)} · ${esc(p.role||'stakeholder')}" style="background:${AVA_COLORS[i%AVA_COLORS.length]}">${esc(initials(p.name))}</span>`).join('')
    + (agents.length?`<span class="ava" title="${agents.length} agent${agents.length>1?'s':''}: ${esc(agents.join(', '))}" style="background:#697180">🤖</span>`:'');
}

function renderStats(){
  const ts = tasks(); const done = ts.filter(t=>t.status==='done').length;
  const open = fbs().filter(openFb).length;
  const pend = fbs().filter(f=>['pending','needs_clarification'].includes(f.status)).length;
  const humans = new Set(fbs().filter(f=>f.authorType==='human').map(f=>f.author));
  const agents = new Set(fbs().filter(f=>f.authorType==='agent').map(f=>f.author));
  // 7-day activity
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toDateString();});
  const per=days.map(ds=>(state.data.events||[]).filter(e=>new Date(e.at).toDateString()===ds).length);
  const mx=Math.max(...per,1);
  $('stats').innerHTML = `
    <div class="stat"><div class="lbl">Tasks completed</div><div class="val">${done}<span style="color:var(--faint);font-size:16px;font-weight:550"> / ${ts.length}</span></div>
      <div class="progress"><i style="width:${ts.length?Math.round(done/ts.length*100):0}%"></i></div></div>
    <div class="stat"><div class="lbl">Feedback inbox</div><div class="val">${pend}</div>
      <div class="hint">${pend? 'waiting for the orchestrator' : '<b>clear</b> — nothing waiting'}</div></div>
    <div class="stat"><div class="lbl">Open threads</div><div class="val">${open}</div>
      <div class="hint">${fbs().length-open} closed, every one replied to</div></div>
    <div class="stat"><div class="lbl">Activity · 7 days</div>
      <div class="spark">${per.map((n,i)=>`<i class="${i===6?'hot':''}" style="height:${Math.max(8,n/mx*100)}%" title="${days[i].slice(0,10)}: ${n} events"></i>`).join('')}</div>
      <div class="hint">${per[6]} today · ${humans.size} human${humans.size===1?'':'s'}, ${agents.size} agent${agents.size===1?'':'s'} active</div></div>`;
}

function renderTabs(){
  const open = fbs().filter(openFb).length;
  const tabsDef = [
    {id:'tasks', label:'Tasks', n: tasks().length},
    {id:'feedback', label:'Feedback', n: open||fbs().length},
    {id:'activity', label:'Activity', n: null},
  ];
  let seg = '';
  if (state.tab==='feedback')
    seg = `<div class="filters">${['open','all','closed'].map(f=>`<button class="seg ${state.fbFilter===f?'on':''}" data-fbf="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>`;
  if (state.tab==='tasks')
    seg = `<div class="filters">${['all','active','done'].map(f=>`<button class="seg ${state.taskFilter===f?'on':''}" data-tf="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>`;
  $('tabs').innerHTML = tabsDef.map(t=>
    `<button class="tab ${state.tab===t.id?'on':''}" data-tab="${t.id}">${t.label}${t.n!==null?`<span class="n">${t.n}</span>`:''}</button>`).join('') + seg;
}

const matches = (txt) => !state.q || txt.toLowerCase().includes(state.q);

function taskRowHtml(t, isSub){
  const kids = childrenOf(t);
  const fb = fbForTask(t); const fbOpen = fb.filter(openFb).length;
  const sel = state.sel?.kind==='task' && state.sel.id===t.shortId;
  const caret = kids.length
    ? `<button class="caret ${state.collapsed.has(t.shortId)?'':'openc'}" data-caret="${esc(t.shortId)}" title="${kids.length} subtask${kids.length>1?'s':''}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 5 7 7-7 7"/></svg></button>`
    : '<span></span>';
  return `<div class="trow ${isSub?'sub':''} ${sel?'sel':''}" data-task="${esc(t.shortId)}">
    ${caret}
    <span class="id">${esc(t.shortId)}</span>
    <span class="col"><div class="ttl">${esc(t.title)}</div></span>
    <span class="rmeta">
      ${fb.length?`<span class="fbn ${fbOpen?'warn':''}" title="${fb.length} feedback, ${fbOpen} open">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.5-.7L3 21l1.8-4.4a8.4 8.4 0 1 1 16.2-5.1z"/></svg>${fbOpen||fb.length}</span>`:''}
      ${t.assignee?`<span class="who ${esc(t.assigneeType)}"><span class="a">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:''}
      <span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span>
    </span></div>`;
}

function renderList(){
  const el = $('list');
  if (state.tab==='tasks'){
    let roots = tasks().filter(t=>!t.parentTaskId);
    if (state.taskFilter==='active') roots = roots.filter(t=>t.status!=='done'||childrenOf(t).some(k=>k.status!=='done'));
    if (state.taskFilter==='done') roots = roots.filter(t=>t.status==='done');
    const rows = [];
    for (const t of roots){
      const kids = childrenOf(t).filter(k=>matches(k.title+' '+k.shortId));
      const hit = matches(t.title+' '+t.shortId) || kids.length;
      if (!hit) continue;
      rows.push(taskRowHtml(t,false));
      if (!state.collapsed.has(t.shortId)) rows.push(...kids.map(k=>taskRowHtml(k,true)));
    }
    el.innerHTML = rows.join('') || `<div class="empty">${state.q?`Nothing matches “<b>${esc(state.q)}</b>”`:'No tasks yet — the orchestrator will seed them'}</div>`;
  }
  else if (state.tab==='feedback'){
    let list = fbs();
    if (state.fbFilter==='open') list = list.filter(openFb);
    if (state.fbFilter==='closed') list = list.filter(f=>!openFb(f));
    list = list.filter(f=>matches([f.body,f.shortId,f.author,f.taskShortId].join(' ')));
    el.innerHTML = list.map(f=>{
      const sel = state.sel?.kind==='fb' && state.sel.id===f.shortId;
      return `<div class="frow ${sel?'sel':''}" data-fb="${esc(f.shortId)}">
        <span class="id">${esc(f.shortId)}</span>
        <span class="col"><div class="fbody">${esc(f.body)||'<i style="color:var(--faint)">screenshot only</i>'}</div>
          <div class="fsub"><span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span>
            <span class="typ typ-${esc(f.type)}">${esc(f.type)}</span>
            ${f.taskShortId?`<span class="id">on ${esc(f.taskShortId)}</span>`:'<span class="id">project-level</span>'}
            ${f.attachments?.length?`<span class="id">📎 ${f.attachments.length}</span>`:''}</div></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
          <span class="pill st-${esc(f.status)}">${esc(nice(f.status))}</span>
          <span class="time" title="${new Date(f.createdAt).toLocaleString('en-GB')}">${relTime(f.createdAt)}</span></span>
      </div>`;}).join('') || `<div class="empty">${state.fbFilter==='open'?'Inbox clear — nothing open':'No feedback here yet'}</div>`;
  }
  else {
    const evs = (state.data.events||[]).filter(e=>matches(e.text));
    const groups = {};
    for (const e of evs){
      const d = new Date(e.at); const today = new Date();
      const key = d.toDateString()===today.toDateString() ? 'Today'
        : d.toDateString()===new Date(today-864e5).toDateString() ? 'Yesterday'
        : d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'short'});
      (groups[key] ??= []).push(e);
    }
    el.innerHTML = Object.entries(groups).map(([k,list])=>
      `<div class="evgroup">${esc(k)}</div>` + list.map(e=>{
        const m = (e.text||'').match(/^([A-Z]+-(?:FB-)?\d+)/);
        const txt = m ? `<b>${esc(m[1])}</b>${esc(e.text.slice(m[1].length))}` : esc(e.text);
        return `<div class="ev"><span class="t">${new Date(e.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span><span class="b"></span><span class="x">${txt}</span></div>`;
      }).join('')).join('') || '<div class="empty">Quiet so far</div>';
  }
}

// ---------- drawer ----------
function renderDrawer(){
  const dr = $('drawer');
  const backBtn = `<button class="iconbtn" id="dback" ${state.stack.length<2?'disabled':''} title="Back">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5m6-7-7 7 7 7"/></svg></button>`;
  const closeBtn = `<button class="iconbtn" id="dclose" title="Close">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`;

  if (!state.sel){
    dr.classList.remove('open');
    dr.innerHTML = `<div class="dempty"><div>
      <div class="big"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></div>
      Select a task or feedback<br>to see everything connected to it</div></div>`;
    $('scrim').classList.remove('on');
    return;
  }
  dr.classList.add('open'); $('scrim').classList.add('on');

  if (state.sel.kind==='task'){
    const t = byShort(state.sel.id); if(!t){ state.sel=null; return renderDrawer(); }
    const kids = childrenOf(t), fb = fbForTask(t), parent = t.parentTaskId ? tasks().find(x=>x._id===t.parentTaskId) : null;
    const evs = eventsForTask(t).slice(0,8);
    dr.innerHTML = `
      <div class="dhead">${backBtn}<span class="id">${esc(t.shortId)}</span><span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span><span class="grow"></span>${closeBtn}</div>
      <div class="dbody">
        ${parent?`<div class="note">subtask of <a href="#" data-go-task="${esc(parent.shortId)}">${esc(parent.shortId)} · ${esc(parent.title)}</a></div>`:''}
        <div class="dtitle">${esc(t.title)}</div>
        ${t.description?`<p style="color:var(--muted);margin-top:6px">${esc(t.description)}</p>`:''}
        <div class="dgrid">
          <span class="k">Assignee</span><span>${t.assignee?`<span class="who ${esc(t.assigneeType)}"><span class="a">${esc(initials(t.assignee))}</span>${esc(t.assignee)}</span>`:'<span style="color:var(--faint)">unassigned</span>'}</span>
          ${t.origin?`<span class="k">Origin</span><span>${esc(t.origin)}</span>`:''}
          ${t.blocker?`<span class="k">Blocked by</span><span style="color:var(--red);font-weight:550">${esc(t.blocker)}</span>`:''}
          <span class="k">Created</span><span title="${new Date(t.createdAt).toLocaleString('en-GB')}">${relTime(t.createdAt)}</span>
          <span class="k">Updated</span><span title="${new Date(t.updatedAt).toLocaleString('en-GB')}">${relTime(t.updatedAt)}</span>
        </div>
        ${t.notes?`<div class="dsec"><h3>Notes</h3><div class="quote">${esc(t.notes)}</div></div>`:''}
        ${kids.length?`<div class="dsec"><h3>Subtasks · ${kids.filter(k=>k.status==='done').length}/${kids.length} done</h3>
          <div class="mini">${kids.map(k=>`<div class="trow" data-task="${esc(k.shortId)}"><span></span><span class="id">${esc(k.shortId)}</span>
            <span class="col"><div class="ttl">${esc(k.title)}</div></span><span class="pill st-${esc(k.status)}">${esc(nice(k.status))}</span></div>`).join('')}</div></div>`:''}
        <div class="dsec"><h3>Feedback on this task · ${fb.filter(openFb).length} open</h3>
          ${fb.length?`<div class="mini">${fb.map(f=>`<div class="frow" data-fb="${esc(f.shortId)}"><span class="id">${esc(f.shortId)}</span>
            <span class="col"><div class="fbody">${esc(f.body)}</div><div class="fsub"><span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span></div></span>
            <span class="pill st-${esc(f.status)}">${esc(nice(f.status))}</span></div>`).join('')}</div>`
          :'<div class="note">none yet — DM Gabbar with “'+esc(t.shortId)+' …” to file the first</div>'}</div>
        ${t.commits?.length?`<div class="dsec"><h3>Commits</h3><div class="commits">${t.commits.map(c=>`<span>· ${esc(c)}</span>`).join('')}</div></div>`:''}
        ${evs.length?`<div class="dsec"><h3>History</h3><div class="devents">${evs.map(e=>`<div><div class="t">${new Date(e.at).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>${esc(e.text)}</div>`).join('')}</div></div>`:''}
      </div>`;
  } else {
    const f = fbByShort(state.sel.id); if(!f){ state.sel=null; return renderDrawer(); }
    const t = f.taskId ? tasks().find(x=>x._id===f.taskId) : null;
    const FLOW = ['pending','triaged','accepted','in_progress','resolved'];
    const idx = FLOW.indexOf(f.status);
    const flow = f.status==='rejected'
      ? FLOW.slice(0,2).map((s,i)=>`<span class="step hit">${nice(s)}</span><span class="arrow">→</span>`).join('')+`<span class="step bad">rejected</span>`
      : FLOW.map((s,i)=>`<span class="step ${i<idx?'hit':i===idx?(s==='resolved'?'hit':'now'):''}">${nice(s)}</span>`).join('<span class="arrow">→</span>');
    dr.innerHTML = `
      <div class="dhead">${backBtn}<span class="id">${esc(f.shortId)}</span><span class="pill st-${esc(f.status)}">${esc(nice(f.status))}</span><span class="grow"></span>${closeBtn}</div>
      <div class="dbody">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
          <span class="who ${esc(f.authorType)}"><span class="a">${esc(initials(f.author))}</span>${esc(f.author)}</span>
          <span class="typ typ-${esc(f.type)}">${esc(f.type)}</span>
          <span class="time" title="${new Date(f.createdAt).toLocaleString('en-GB')}">${relTime(f.createdAt)}</span>
        </div>
        <div class="quote">${esc(f.body)||'<i>screenshot only</i>'}</div>
        ${f.attachments?.length?`<div class="shots">${f.attachments.map(a=>`<a href="${esc(a)}" target="_blank"><img src="${esc(a)}" alt="attachment"></a>`).join('')}</div>`:''}
        ${f.slack?'<div class="note">came in via Slack — every status change below replies in that thread</div>':''}
        <div class="dsec"><h3>Lifecycle</h3><div class="flow">${flow}</div></div>
        ${f.resolution?`<div class="dsec"><h3>${f.status==='rejected'?'Reason':'Resolution'}</h3>
          <div class="resol ${f.status==='rejected'?'neg':''}">${esc(f.resolution)}</div></div>`:''}
        <div class="dsec"><h3>Task</h3>
          ${t?`<div class="taskcard" data-task="${esc(t.shortId)}">
              <span class="id">${esc(t.shortId)}</span><span class="col" style="flex:1"><div class="ttl">${esc(t.title)}</div></span>
              <span class="pill st-${esc(t.status)}">${esc(nice(t.status))}</span></div>`
          :'<div class="note">filed at project level — the orchestrator will attach or promote it</div>'}
          ${f.resolvedTaskShortId&&f.resolvedTaskShortId!==t?.shortId?`<div class="note" style="margin-top:6px">handled by <a href="#" data-go-task="${esc(f.resolvedTaskShortId)}">${esc(f.resolvedTaskShortId)}</a></div>`:''}</div>
      </div>`;
  }
}

// ---------- selection / navigation ----------
function select(kind, id, push=true){
  if (state.sel && state.sel.kind===kind && state.sel.id===id) { renderDrawer(); return; }
  state.sel = {kind, id};
  if (push) state.stack.push(state.sel);
  history.replaceState(null,'',`#/${kind==='task'?'t':'f'}/${id}`);
  renderList(); renderDrawer();
}
function clearSel(){
  state.sel=null; state.stack=[];
  history.replaceState(null,'',location.pathname);
  renderList(); renderDrawer();
}
function goBack(){
  if (state.stack.length<2) return;
  state.stack.pop();
  const prev = state.stack[state.stack.length-1];
  state.sel = prev;
  history.replaceState(null,'',`#/${prev.kind==='task'?'t':'f'}/${prev.id}`);
  renderList(); renderDrawer();
}
function applyHash(){
  const m = location.hash.match(/^#\/(t|f)\/([A-Za-z0-9-]+)$/);
  if (m) { state.sel={kind:m[1]==='t'?'task':'fb', id:m[2].toUpperCase()}; state.stack=[state.sel]; }
}

// ---------- events ----------
document.addEventListener('click', e=>{
  const caret = e.target.closest('[data-caret]');
  if (caret){ e.stopPropagation();
    const id = caret.dataset.caret;
    state.collapsed.has(id) ? state.collapsed.delete(id) : state.collapsed.add(id);
    renderList(); return; }
  const goTask = e.target.closest('[data-go-task]');
  if (goTask){ e.preventDefault(); select('task', goTask.dataset.goTask); return; }
  const tr = e.target.closest('[data-task]');
  if (tr){ select('task', tr.dataset.task); return; }
  const fr = e.target.closest('[data-fb]');
  if (fr){ select('fb', fr.dataset.fb); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab){ state.tab = tab.dataset.tab; renderTabs(); renderList(); return; }
  const fbf = e.target.closest('[data-fbf]');
  if (fbf){ state.fbFilter = fbf.dataset.fbf; renderTabs(); renderList(); return; }
  const tf = e.target.closest('[data-tf]');
  if (tf){ state.taskFilter = tf.dataset.tf; renderTabs(); renderList(); return; }
  if (e.target.closest('#dback')) return goBack();
  if (e.target.closest('#dclose')) return clearSel();
  if (e.target.id==='scrim') return clearSel();
});
$('q').addEventListener('input', e=>{ state.q = e.target.value.trim().toLowerCase(); renderList(); });
document.addEventListener('keydown', e=>{
  if ((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); $('q').focus(); $('q').select(); }
  if (e.key==='Escape'){ if (document.activeElement===$('q')) { $('q').blur(); } else clearSel(); }
});

// ---------- data flow ----------
async function load(){
  const r = await fetch(`/api/p/${capId}`);
  if (!r.ok){ $('list').innerHTML = '<div class="empty">Board not found — check the link</div>'; return; }
  state.data = await r.json();
  render();
}
let reloadT;
const es = new EventSource(`/api/p/${capId}/stream`);
es.addEventListener('message', ()=>{ clearTimeout(reloadT); reloadT=setTimeout(load, 250); });
es.onopen = ()=> $('livedot')?.classList.remove('off');
es.onerror = ()=> $('livedot')?.classList.add('off');

applyHash();
load();
</script>
</body>
</html>
